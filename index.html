<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Japan 2026</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2314161A'/%3E%3Ccircle cx='90' cy='74' r='30' fill='%23A61C1C'/%3E%3Crect x='38' y='120' width='104' height='7' rx='3.5' fill='%23FAFAF8'/%3E%3Crect x='38' y='136' width='68' height='7' rx='3.5' fill='%237A7C80'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--ink:#14161A;--paper:#FAFAF8;--card:#FFFFFF;--rule:#E6E6E1;--muted:#7A7C80;--dim:#9B9DA1;
--ok:#2E7D32;--mid:#C99A1E;--tour:#C0392B;--blue:#1E5299;
--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
--ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);}
@media(prefers-color-scheme:dark){:root{--ink:#F2F2F0;--paper:#0E1013;--card:#191C21;--rule:#282C33;--muted:#9A9DA3;--dim:#6E7278}}
html,body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(58px + var(--sab))}
/* ---- top bar ---- */
#top{position:sticky;top:0;z-index:50;background:var(--legc,#A61C1C);color:#fff;padding:calc(var(--sat) + 10px) 16px 11px;transition:background .3s}
#top .leg{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.82;font-weight:700}
#top .ttl{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-top:2px;line-height:1.15}
#top .sub{font-size:12px;opacity:.85;margin-top:3px;font-variant-numeric:tabular-nums}
/* ---- day strip ---- */
#strip{position:sticky;top:0;z-index:40;display:flex;gap:6px;overflow-x:auto;padding:9px 12px;background:var(--paper);
 border-bottom:1px solid var(--rule);scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:52px;text-align:center;padding:6px 9px;border-radius:11px;background:var(--card);
 border:1px solid var(--rule);font-size:11px;line-height:1.25;color:var(--muted)}
.chip b{display:block;font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on b{color:#fff}
.chip.today::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--tour);margin:3px auto 0}
/* ---- timeline ---- */
main{padding:14px 14px 26px}
.rail{position:relative;padding-left:66px}
.rail::before{content:'';position:absolute;left:51px;top:6px;bottom:6px;width:2px;background:var(--rule)}
.ev{position:relative;margin-bottom:12px}
.ev .tm{position:absolute;left:-66px;top:1px;width:40px;text-align:right;font-family:var(--mono);
 font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.ev .tm i{display:block;font-style:normal;font-size:10px;color:var(--dim);font-weight:400}
.ev .node{position:absolute;left:-22px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--card);
 border:2px solid var(--nc,var(--muted));display:grid;place-items:center;font-size:7.5px}
.card{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--nc,var(--muted));
 border-radius:11px;padding:10px 12px}
.card h3{font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.2px}
.card p{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:5px}
.card .tr{font-size:11.5px;margin-top:6px;color:var(--dim);display:flex;gap:5px;align-items:flex-start}
.card .tr b{color:var(--blue);font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.vibe{font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:20px;color:#fff}
.mapl{font-size:11.5px;font-weight:700;color:var(--blue);text-decoration:none;padding:3px 0}
.now{display:flex;align-items:center;gap:7px;margin:0 0 12px -66px;padding-left:66px}
.now .dot{width:9px;height:9px;border-radius:50%;background:var(--tour);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.now span{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--tour);text-transform:uppercase}
.hotel{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--rule);
 border-radius:11px;padding:9px 12px;margin-bottom:14px;font-size:12.5px}
.hotel a{color:var(--blue);text-decoration:none;font-weight:700;margin-left:auto;white-space:nowrap;font-size:11.5px}
/* ---- lists ---- */
.sec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.sec:first-child{margin-top:2px}
.li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);
 border-radius:11px;padding:10px 12px;margin-bottom:7px}
.li .when{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 46px;padding-top:1px;font-variant-numeric:tabular-nums}
.li .nm{font-size:14px;font-weight:650;line-height:1.3;flex:1}
.li .nm em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.pill{font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:20px;letter-spacing:.03em;white-space:nowrap}
.st-booked{background:#DCEFDD;color:#2E6B34}.st-pending{background:#FBEBCF;color:#8A6113}
.st-todo{background:#F7DADA;color:#9C3B3B}.st-walkin{background:#D9E7F7;color:#1E5299}
@media(prefers-color-scheme:dark){.st-booked{background:#1C3320;color:#8FD196}.st-pending{background:#3A2E14;color:#E3BE72}
.st-todo{background:#3A1F1F;color:#E39A9A}.st-walkin{background:#16283F;color:#8FBBEC}}
.gl{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.gl b{font-size:14px;font-weight:750}.gl p{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px}
#q{width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--rule);background:var(--card);
 color:var(--ink);font-size:16px;font-family:var(--ui);margin-bottom:12px}
#q:focus{outline:2px solid var(--blue);outline-offset:-1px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 20px;line-height:1.5}
/* ---- tab bar ---- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:color-mix(in srgb,var(--paper) 88%,transparent);
 backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
 border-top:1px solid var(--rule);padding-bottom:var(--sab)}
#tabs button{flex:1;background:none;border:0;padding:8px 0 7px;color:var(--muted);font-family:var(--ui);
 font-size:10px;font-weight:650;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--legc,#A61C1C)}
@media(prefers-color-scheme:dark){#tabs button.on{color:#fff}}
</style>
</head>
<body>
<header id="top"><div class="leg" id="tLeg"></div><div class="ttl" id="tTitle"></div><div class="sub" id="tSub"></div></header>
<div id="strip"></div>
<main id="view"></main>
<nav id="tabs">
<button data-t="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now</button>
<button data-t="days"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Days</button>
<button data-t="food"><svg viewBox="0 0 24 24"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 11v10"/><path d="M18 3c-1.5 2-2 4-2 6s.5 3 2 3v9"/></svg>Food</button>
<button data-t="terms"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M9 8h7M9 12h7"/></svg>Info</button>
<button data-t="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find</button>
</nav>
<script>
const D={"days":[{"iso":"2026-08-24","date":"Mon 24 Aug","title":"Arrive & Shibuya","leg":"Tokyo — Arrival","colour":"#A61C1C","hotel":"TRUNK(HOTEL) YOYOGI PARK — Tomigaya, Shibuya-ku","blocks":[{"s":"10:55","e":"12:30","t":"Land HND → TRUNK(HOTEL) Yoyogi Park","d":"Landing 10:55 — immigration + bags (~30–45 min), then transfer to Tomigaya/Yoyogi Park (~30–40 min). Grab a Welcome Suica, or add Suica to Apple Wallet, before leaving the terminal.","tr":"Keikyu/Monorail → Yamanote, or taxi","m":true,"v":"","k":"transport"},{"s":"12:30","e":"14:00","t":"Bags drop, lunch + first wander","d":"Rooms likely aren't ready till 15:00 — hotels hold bags happily. An easy noodle-counter or café lunch, then a loose first look around Tomigaya and Yoyogi Park to fight the jet lag.","tr":"WALK from the hotel","m":true,"v":"","k":"meal"},{"s":"14:00","e":"17:00","t":"Check-in + rest + Yoyogi Park wander","d":"Proper check-in once the room's ready; shower off the flight, then a gentle wander — Yoyogi Park is across the street, Harajuku and Meiji Shrine a short walk further. Nothing that needs stamina today.","tr":"WALK","m":true,"v":"","k":"free"},{"s":"17:15","e":"17:45","t":"Shibuya Crossing, ground level","d":"Stand in the scramble itself — up to 3,000 people crossing at once from all directions. The Hachikō statue is the classic meeting-point photo.","tr":"WALK ~10 min","m":true,"v":"tourist","k":"visit"},{"s":"17:50","e":"18:15","t":"Scramble Square 12F — free observation","d":"A free, far-quieter deck looking straight down on the crossing (different elevator from Shibuya Sky, same building). Open to 11:30pm — locals' favourite, no queue.","tr":"Elevator inside Scramble Square, 12F","m":true,"v":"local","k":"visit"},{"s":"18:30","e":"19:30","t":"Shibuya Sky at sunset (optional)","d":"Open-air rooftop 230m up — the whole city turning gold, Fuji on a clear evening. Not essential after the free 12F deck, but worth it for the full 360° payoff if you want to splash out. BOOK a sunset slot ahead; they sell out first. Separate elevator from the 12F deck, via the 14th-floor Sky Gate.","tr":"WALK ~10 min / one floor up from 14F","m":true,"v":"","k":"visit"},{"s":"20:30","e":"22:15","t":"Dinner — Yakitori Shinohara (Nishi-Azabu)","d":"Chicken kaiseki built around rare Takasaka and Kokutei chicken — Kokutei is unique to Japan — grilled over Kishu binchōtan. Tabelog Top-100 (2023), 15 seats, striking room. Booked for 8:30pm (Friday had no space; Thursday did). BOOK ahead via TableCheck/OMAKASE — no walk-ins.","tr":"Taxi from Shibuya (~15 min)","m":true,"v":"mid","k":"meal"},{"s":"22:30","e":"23:45","t":"Nonbei Yokocho","d":"'Drunkard's Alley' — two lanes of tiny 6-seat bars under the tracks. Pick a door with a friendly glow.","tr":"Taxi back to Shibuya (~15 min)","m":true,"v":"tourist","k":"bar"},{"s":"23:00","e":"23:30","t":"The Church, Dogenzaka (optional, late)","d":"A nightclub built to look exactly like a chapel — wooden pews, stained glass, an altar turned DJ booth, waitresses dressed as nuns. Drinks include a snake-infused liquor shot and 'X-rated' mystery shots. Open daily 8pm–5am, 30 seconds from Shibuya Crossing — only if you've still got legs after night one.","tr":"WALK ~5 min from Nonbei Yokocho","m":true,"v":"","k":"visit"}]},{"iso":"2026-08-25","date":"Tue 25 Aug","title":"Asakusa & the east","leg":"Tokyo — Arrival","colour":"#A61C1C","hotel":"TRUNK(HOTEL) YOYOGI PARK — Tomigaya, Shibuya-ku","blocks":[{"s":"08:30","e":"09:05","t":"To Asakusa","d":"Beat the heat and the coach groups.","tr":"Ginza Line from Shibuya to Asakusa — the terminus, ~30 min, no change. Exit 1/3 for Kaminarimon","m":false,"v":"","k":"transport"},{"s":"09:05","e":"10:45","t":"Sensō-ji","d":"Tokyo's oldest temple (645 AD): the giant red Kaminarimon lantern, Nakamise snack street, the main hall and pagoda. Draw an omikuji — tie a bad one to the rack to leave the luck behind.","tr":"On foot","m":true,"v":"tourist","k":"visit"},{"s":"10:45","e":"11:15","t":"The 'Golden Turd', Asahi Beer HQ","d":"The Asahi headquarters by the Sumida River is built to look like a pint of beer, topped with a huge golden flame sculpture meant to represent beer's 'burning heart' — every local just calls it the golden turd. Genuinely enormous, genuinely absurd, worth the detour for the photo alone.","tr":"WALK from Sensō-ji, across the river (~10 min)","m":true,"v":"mid","k":"visit"},{"s":"11:30","e":"12:45","t":"Kappabashi Dougu Street — plastic food","d":"'Kitchen Town': pro knives, ceramics, and an entire street dedicated to hyper-realistic fake food — individual plastic sushi, ramen bowls, pancakes, bizarrely mesmerising and genuinely for sale. Then drift south into Kuramae — Tokyo's 'Brooklyn' of coffee roasters and leather ateliers. Chopsticks: Hashitou is the trusted buy here — careful, some Kappabashi stock isn't as authentic as it looks.","tr":"WALK back across the river, ~15 min","m":true,"v":"mid","k":"visit"},{"s":"12:30","e":"13:30","t":"Lunch in Kuramae","d":"A riverside café, or old-school tempura/unagi back toward Asakusa. Taiyaki for the walk.","tr":"","m":true,"v":"mid","k":"meal"},{"s":"14:00","e":"16:00","t":"Sumida riverside or Tokyo Skytree","d":"Walk the river, or go up the 350m Skytree deck (by Asakusa) if the sky's clear. Optional pace — this is the flex slot.","tr":"WALK / Asakusa Line one stop","m":true,"v":"mid","k":"visit"},{"s":"16:15","e":"17:40","t":"Back to Shibuya + rest","d":"","tr":"Ginza Line back (~30 min)","m":false,"v":"","k":"transport"},{"s":"17:45","e":"18:40","t":"SG Club (pre-dinner)","d":"One of Shibuya's best bars, from a Gen Yamamoto protégé — a quick, excellent cocktail before dinner rather than a late-night stop. Small, so go early.","tr":"WALK, Shibuya","m":true,"v":"local","k":"meal"},{"s":"19:30","e":"21:15","t":"Dinner — Gohan Ya Isshin, Daikanyama — BOOKED","d":"Charcoal yakitori and seasonal washoku, sake-led — the concierge pick, booked through TRUNK for 1 person. B1, Building A, Twin Building Daikanyama, 30-3 Sarugakucho. Tel 03-6455-1614. Note: no formal cancellation policy, but the table is released automatically if you are more than 15 minutes late.","tr":"Tōkyū Tōyoko one stop Shibuya → Daikanyama, or WALK ~15 min","m":true,"v":"local","k":"meal"},{"s":"21:30","e":"23:00","t":"bar Track (Tomigaya)","d":"Your friend's 'best bar of the trip' — hi-fi vinyl listening bar, superb whisky. Worth the short taxi.","tr":"Taxi from Daikanyama to Tomigaya (~12 min)","m":true,"v":"local","k":"bar"}]},{"iso":"2026-08-26","date":"Wed 26 Aug","title":"Old Tokyo & gardens","leg":"Tokyo — Arrival","colour":"#A61C1C","hotel":"TRUNK(HOTEL) YOYOGI PARK — Tomigaya, Shibuya-ku","blocks":[{"s":"09:00","e":"09:30","t":"To Yanaka","d":"","tr":"JR Yamanote Line to Nippori (~25 min from Shibuya), west exit","m":false,"v":"","k":"transport"},{"s":"09:30","e":"11:45","t":"Yanaka old town","d":"Start with coffee + the egg sando at Kayaba Coffee (1938 kissaten), then Nezu Shrine's mini torii tunnel, and the pre-war lanes: temple streets, the cemetery's cherry avenue, Yanaka Ginza's shotengai snacks.","tr":"On foot","m":true,"v":"local","k":"visit"},{"s":"12:00","e":"13:00","t":"Lunch — Kamachiku (udon)","d":"Famed handmade udon in a converted 1910 brick warehouse beside Nezu Shrine. Queue moves fast.","tr":"WALK from Nezu Shrine","m":true,"v":"mid","k":"meal"},{"s":"13:45","e":"15:45","t":"Hama-rikyū Gardens","d":"A tidal Edo garden ringed by skyscrapers — matcha and a sweet in the teahouse on the pond island. (Or swap for the Imperial Palace East Gardens.)","tr":"JR Yamanote to Shimbashi, ~15 min walk","m":true,"v":"mid","k":"visit"},{"s":"16:15","e":"17:45","t":"Back to Shibuya + rest","d":"","tr":"JR Yamanote from Shimbashi","m":false,"v":"","k":"transport"},{"s":"18:00","e":"18:30","t":"To Omoide Yokocho","d":"","tr":"JR Yamanote to Shinjuku (~7 min), west side","m":false,"v":"","k":"bar"},{"s":"18:30","e":"21:30","t":"Dinner — Omoide Yokocho izakaya-hop","d":"Starting 6:30: graze several of the tiny counters under the tracks. A few to differentiate rather than repeat the same style: Asadachi (yakitori, raw-egg tsukune), Kabuto (the tiny counter famous for skewers cooked over an open grill right in front of you), and Buta-San (pork specialities, motsu-nikomi stew). Pick two or three, one drink and a couple of skewers at each, then move on.","tr":"On foot, lane to lane","m":true,"v":"mid","k":"meal"},{"s":"21:45","e":"23:15","t":"Golden Gai (via Kabukichō)","d":"Walk east past the Godzilla head over Kabukichō into Golden Gai's 200 tiny bars — seek out Open Book (yuzu lemon sours). Late-night onigiri at Mamma Onigiri; jazz at Shinjuku Pit Inn if the programme's good.","tr":"WALK ~10 min from Omoide Yokocho","m":true,"v":"tourist","k":"bar"}]},{"iso":"2026-08-27","date":"Thu 27 Aug","title":"Tsukiji & Borderless","leg":"Tokyo — Arrival","colour":"#A61C1C","hotel":"TRUNK(HOTEL) YOYOGI PARK — Tomigaya, Shibuya-ku","blocks":[{"s":"08:00","e":"09:30","t":"Breakfast — Tsukiji outer market","d":"Go hungry, ~9am: Seagen for the chirashi bowl, Yamacho or Shouro for tamagoyaki omelette, and Tonboya's tuna-steak stall. Moved here from Friday so the last Tokyo morning stays free.","tr":"Hibiya/Ginza Line to Tsukiji or Higashi-Ginza","m":true,"v":"tourist","k":"meal"},{"s":"10:00","e":"11:30","t":"Back to Shibuya + rest","d":"A gap before Borderless — drop back to the hotel, or wander Ginza/Marunouchi if you would rather stay out.","tr":"Hibiya/Ginza Line back (~25 min)","m":false,"v":"","k":"transport"},{"s":"13:30","e":"14:00","t":"To Azabudai Hills","d":"","tr":"Metro to Kamiyachō (Hibiya Line), Exit 5 → Garden Plaza B, ~20 min","m":false,"v":"","k":"transport"},{"s":"14:00","e":"16:30","t":"teamLab Borderless, Azabudai","d":"The 'museum without a map' — Bubble Universe, the Megalith rooms, art that flows between spaces. BOOKED — entry window 14:00-14:30, ~2.5 hrs inside once you're through.","tr":"On foot within Azabudai Hills","m":true,"v":"tourist","k":"visit"},{"s":"17:00","e":"18:00","t":"Roppongi Hills / Mori Tower observation (optional)","d":"If you want a free-ish alternative view before dinner: Roppongi Hills or the Mori Tower observation deck as the lights come on — Azabudai's practically next door. Not essential; the main view tonight is Janu Bar afterward.","tr":"WALK ~10 min from Azabudai","m":true,"v":"","k":"visit"},{"s":"20:00","e":"21:30","t":"Dinner — Afuri Roppongi (ramen)","d":"Yuzu-shio ramen — light, citrus-clear broth, a genuine change of pace after a day of temples and digital art. Swapped in for Torioka: you already have Yakitori Shinohara booked, so this brings ramen into the trip and adds variety instead of repeating the same cuisine.","tr":"WALK, Roppongi (~10 min from Azabudai)","m":true,"v":"mid","k":"meal"},{"s":"22:15","e":"23:45","t":"Janu Bar, Azabudai Hills","d":"Floor-to-ceiling windows framing Tokyo Tower directly from the 5th floor, plus an outdoor Garden Terrace right up against the view. Curated by mixologist Shuzo Nagumo — inventive cocktails themed on Tokyo neighbourhoods. Walk-ins welcome, open to midnight. Right in Azabudai Hills — no taxi needed.","tr":"WALK ~5 min from Azabudai Hills","m":true,"v":"mid","k":"bar"}]},{"iso":"2026-08-28","date":"Fri 28 Aug","title":"Tokyo → Osaka, Castle & Minami","leg":"Osaka","colour":"#144A8C","hotel":"The St. Regis Osaka — Honmachi","blocks":[{"s":"08:30","e":"10:30","t":"Free morning in Tokyo","d":"Deliberately open — Tsukiji was done yesterday. A slow breakfast near the hotel, a last Shibuya wander, or simply a lie-in before the shinkansen.","tr":"","m":false,"v":"","k":"free"},{"s":"10:30","e":"11:00","t":"Forward luggage + repack","d":"Ship the big bag to the St. Regis Osaka by takkyubin (hotel concierge arranges; arrives next day).","tr":"","m":false,"v":"","k":"free"},{"s":"11:30","e":"14:30","t":"Tokyo → Osaka","d":"Leaving Tokyo mid-morning. Big bag already forwarded ahead by takkyubin — travel light.","tr":"TōkaidōShinkansen, Tokyo → Shin-Osaka (~2h30)","m":true,"v":"","k":"transport"},{"s":"15:00","e":"15:30","t":"Check in — The St. Regis Osaka (first)","d":"Drop everything before heading out — Midosuji, Honmachi.","tr":"WALK/taxi from Shin-Osaka (~15 min)","m":true,"v":"","k":"free"},{"s":"15:45","e":"16:45","t":"Late lunch — Mizuno (okonomiyaki)","d":"Dotonbori institution since 1945; Tabelog ~3.8, Michelin Bib Gourmand. Walk-in only, no reservations — and mid-afternoon is the single best time to turn up, well outside the lunch and dinner queues. Lands you straight in Minami for the evening wander.","tr":"Metro Midōsuji to Namba, then WALK","m":true,"v":"mid","k":"meal"},{"s":"17:00","e":"20:30","t":"Namba → Shinsaibashi → Dotonbori (unhurried)","d":"A proper 3+ hrs, not a quick pass-through: the Ebisubashi crossing, the Glico sign, the covered arcades, side-street browsing. Namba Yasaka Shrine's giant lion-head stage is ~10 min further. You're already in Minami after Mizuno, so this flows straight on.","tr":"","m":true,"v":"","k":"transport"},{"s":"22:00","e":"22:45","t":"KARUDA (Shinsaibashi)","d":"A craft-cocktail speakeasy from the team behind Bar Nayuta — industrial decor, an espresso Negroni worth ordering. NOTE: documented as a cocktail bar, not confirmed as a jazz venue — worth checking if jazz was the specific draw.","tr":"WALK, Shinsaibashi","m":true,"v":"local","k":"bar"}]},{"iso":"2026-08-29","date":"Sat 29 Aug","title":"Day trip — Himeji Castle","leg":"Osaka","colour":"#144A8C","hotel":"The St. Regis Osaka — Honmachi","blocks":[{"s":"07:45","e":"08:45","t":"Osaka → Himeji","d":"Aim to be at the castle for the 9:00 opening — the first hour is by far the quietest, and Saturday draws crowds by late morning.","tr":"JR Special Rapid from Osaka Stn (~60 min, ~¥1,520) — or SanyōShinkansen from Shin-Osaka (~30 min, ~¥2,980)","m":false,"v":"","k":"transport"},{"s":"08:45","e":"09:10","t":"Walk to the castle","d":"A straight 15–20 min walk north up Otemae-dori — the white keep is in view the whole way.","tr":"WALK ~15-20 min from Himeji Station north exit","m":false,"v":"","k":"transport"},{"s":"09:10","e":"11:30","t":"Himeji Castle","d":"Japan's most complete original castle and a UNESCO site, essentially unchanged since 1609 — where Osaka Castle is a 1931 concrete rebuild, this is the real thing. Six floors up a single winding staircase; shoes come off, so wear easy ones. Non-resident entry ¥2,500 (raised from ¥1,000 in March 2026). Timed digital tickets can be bought up to 90 days ahead — worth it on a Saturday.","tr":"On foot","m":true,"v":"tourist","k":"visit"},{"s":"11:30","e":"12:30","t":"Kōko-en Garden","d":"Nine walled Edo-style gardens beside the castle, on the site of the old samurai residences — combo ticket with the castle. A calm counterpoint after the keep.","tr":"WALK, adjacent to the castle","m":true,"v":"mid","k":"visit"},{"s":"12:45","e":"14:00","t":"Lunch — Himeji arcades","d":"Miyukidori and Honmachi Shotengai run back toward the station — local eateries, no booking needed.","tr":"WALK back down Otemae-dori","m":true,"v":"local","k":"meal"},{"s":"14:00","e":"15:30","t":"Himeji town, unhurried (optional)","d":"Covered shopping arcades and back streets, or head back early if the castle has taken it out of you.","tr":"WALK","m":false,"v":"","k":"visit"},{"s":"15:45","e":"17:00","t":"Himeji → Osaka","d":"Back in good time for dinner.","tr":"JR Special Rapid (~60 min) or SanyōShinkansen (~30 min)","m":false,"v":"","k":"transport"}]},{"iso":"2026-08-30","date":"Sun 30 Aug","title":"Katsuo-ji, Kita & Tenma","leg":"Osaka","colour":"#144A8C","hotel":"The St. Regis Osaka — Honmachi","blocks":[{"s":"09:00","e":"10:00","t":"To Katsuo-ji, Minoo","d":"Head north out of the city.","tr":"Midōsuji Line + Minoo Line (~50 min)","m":true,"v":"","k":"transport"},{"s":"10:00","e":"11:30","t":"Katsuo-ji Temple","d":"The 'temple of winning your luck' — grounds carpeted with thousands of red Daruma dolls tucked into every nook. Offbeat and magical.","tr":"On foot","m":true,"v":"local","k":"visit"},{"s":"12:00","e":"13:00","t":"Lunch near Minoo","d":"A soba or udon spot before heading back into the city.","tr":"","m":true,"v":"mid","k":"meal"},{"s":"14:00","e":"15:30","t":"Nakazakichō + Nibunnoichi","d":"Retro-hip lanes: converted-machiya cafés, vintage shops, murals. Nibunnoichi (8 1/2 hakka nibunnoichi) is a European/American vintage shop tucked in an unmarked building — Osaka since 2014.","tr":"Tanimachi Line to Nakazakichō","m":true,"v":"local","k":"visit"},{"s":"15:45","e":"16:30","t":"Gate Tower Building, Fukushima-ku","d":"A working highway — the Hanshin Expressway's Ikeda Route — passes right through the building's 5th, 6th and 7th floors. The lift skips those levels entirely; a 5-year stalemate between landowners and the expressway corporation produced this. Genuinely odd in person.","tr":"Taxi/short walk from Nakazakichō (~15 min)","m":true,"v":"local","k":"visit"},{"s":"16:45","e":"17:30","t":"City view — Umeda Sky Building or Kaze no Hiroba","d":"Either the Floating Garden observatory, or the free 11th-floor terrace (Kaze no Hiroba) at Osaka Station's North Gate Building — open 7am–midnight, great views, no ticket needed, even a FamilyMart for a drink.","tr":"WALK in Kita","m":true,"v":"mid","k":"visit"},{"s":"18:00","e":"20:00","t":"Dinner — street food graze, Kita","d":"Osaka's most local nightlife: the Tenjinbashisuji arcade spilling into cheap, buzzing izakaya.","tr":"JR/Metro to Tenma","m":true,"v":"local","k":"meal"},{"s":"20:15","e":"22:00","t":"Tenma / Tenjinbashi standing bars","d":"Loud, cheap, real — where Osakans actually drink, not a tourist circuit.","tr":"WALK","m":true,"v":"local","k":"bar"}]},{"iso":"2026-08-31","date":"Mon 31 Aug","title":"Day trip — Hiroshima","leg":"Osaka","colour":"#144A8C","hotel":"The St. Regis Osaka — Honmachi","blocks":[{"s":"06:30","e":"07:55","t":"Shin-Osaka → Hiroshima (early)","d":"Leaving earlier gives real extra time at the Peace Park before the day heats up.","tr":"SanyōShinkansen (Nozomi/Sakura, ~1h25) — check the first realistic departure ~6:30-6:45am","m":true,"v":"","k":"transport"},{"s":"08:15","e":"11:30","t":"Peace Memorial Park & Museum","d":"The A-Bomb Dome, the cenotaph, the essential and moving museum. Give it unhurried time.","tr":"Tram from Hiroshima Stn","m":true,"v":"tourist","k":"visit"},{"s":"12:00","e":"13:00","t":"Lunch — Hiroshima okonomiyaki","d":"Layered with noodles — distinct from Osaka's mixed style. Try Okonomimura's stacked stalls.","tr":"WALK","m":true,"v":"mid","k":"meal"},{"s":"13:30","e":"15:00","t":"Hiroshima Castle or Shukkei-en garden","d":"If time allows after the Peace Park.","tr":"WALK/tram","m":true,"v":"mid","k":"visit"},{"s":"16:00","e":"17:25","t":"Hiroshima → Shin-Osaka","d":"","tr":"Shinkansen (~1h25)","m":true,"v":"","k":"transport"},{"s":"19:30","e":"21:00","t":"Dinner — Kawafuku Honten (udon)","d":"Something light and local after a heavy day. Booked for around 7:30pm. Tabelog 3.50, 'Very good.'","tr":"WALK/metro","m":true,"v":"local","k":"meal"}]},{"iso":"2026-09-01","date":"Tue 1 Sep","title":"Shitennō-ji, Moegi, Kuromon & Shinsekai","leg":"Osaka","colour":"#144A8C","hotel":"The St. Regis Osaka — Honmachi","blocks":[{"s":"10:00","e":"11:00","t":"Shitennō-ji Temple","d":"One of Japan's oldest Buddhist temples, founded by Prince Shōtoku — a calm, unhurried morning.","tr":"Metro to Shitennoji-mae Yuhigaoka","m":true,"v":"mid","k":"visit"},{"s":"12:15","e":"13:30","t":"Lunch — Moegi (okonomiyaki)","d":"Friend rec, 'Must!' Tucked down a laneway in Ura-Namba, near Nippombashi — one guy cooking, decent yakisoba too. Watch it built to order on the teppan.","tr":"Metro to Nippombashi (~10 min)","m":true,"v":"local","k":"meal"},{"s":"13:45","e":"14:30","t":"Kuromon Ichiba Market (wander only)","d":"Right by Moegi — but keep it light after lunch. Maguroya Kurogin's tuna-slicing is worth watching even without eating; a small snack (not a full course) if anything tempts you.","tr":"WALK from Moegi (~5 min)","m":true,"v":"mid","k":"visit"},{"s":"14:45","e":"16:15","t":"Shinsekai, Tsutenkaku & pachinko parlours (unhurried)","d":"A different Osaka: retro, gritty, inflatable blowfish hanging outside restaurants, almost no tourists. Time to actually wander — Tsutenkaku Tower, the kushikatsu alleys, a pachinko parlour if curious (disorienting lights and noise the moment the doors slide open). Tennoji Park and the zoo are right next door if you want to extend further.","tr":"WALK from Kuromon (~15 min)","m":true,"v":"","k":"visit"},{"s":"16:15","e":"18:15","t":"Rest before dinner","d":"","tr":"","m":false,"v":"","k":"meal"},{"s":"19:00","e":"21:00","t":"Dinner — Ajikitchō Bunbu-an — BOOKED 19:00","d":"Michelin 1★ for eight consecutive years — a genuine offshoot of Kitchō, one of Japan's most legendary kaiseki lineages. Omakase Course ¥25,000 (¥30,250 with service). CONFIRMED via St. Regis for 1 person, 19:00. B1F, Hommachi Garden City, 3-6-4 Hommachi, Chuo-ku. Note: 100% cancellation charge applies from 3 days before.","tr":"WALK ~5 min from the hotel","m":true,"v":"local","k":"meal"},{"s":"21:45","e":"23:00","t":"bar SANÉE or Bar Nakamura","d":"Two friend-recommended bars — SANÉE ('cool bar') or Nakamura ('great bar in a good location'). Pick one, or both if the night allows. Big Echo karaoke nearby if you want to keep going.","tr":"WALK/taxi from Konoha","m":true,"v":"local","k":"bar"}]},{"iso":"2026-09-02","date":"Wed 2 Sep","title":"Arrive Naoshima & Honmura","leg":"Naoshima & Teshima","colour":"#0F6B63","hotel":"MY LODGE Naoshima — Miyanoura","blocks":[{"s":"09:00","e":"11:30","t":"Osaka → Naoshima","d":"Shinkansen to Okayama, local to Uno, ferry across the Seto Inland Sea.","tr":"Train + ferry","m":true,"v":"","k":"transport"},{"s":"11:30","e":"11:45","t":"Red pumpkin (Kusama)","d":"Quick photo at Miyanoura port on arrival.","tr":"At the port","m":true,"v":"","k":"visit"},{"s":"12:00","e":"13:00","t":"Check in — Benesse House / Honmura guesthouse 📍 Open in Maps","d":"","tr":"","m":false,"v":"","k":"free"},{"s":"13:30","e":"15:15","t":"Honmura: Naoshima New Museum of Art","d":"Tadao Ando's tenth island building (opened 2025); Murakami, Cai Guo-Qiang.","tr":"Shuttle or e-bike to Honmura","m":true,"v":"","k":"visit"},{"s":"15:35","e":"16:15","t":"Minamidera (Art House) — BOOKED","d":"A pitch-dark James Turrell piece; your eyes adjust over minutes. Booked slot — arrive a few minutes early.","tr":"On foot in Honmura","m":true,"v":"","k":"visit"},{"s":"18:30","e":"19:30","t":"Yellow pumpkin at sunset","d":"The icon, on the Benesse pier at golden hour. Walk / shuttle","tr":"","m":true,"v":"","k":"visit"},{"s":"20:00","e":"21:30","t":"Island dinner","d":"The island empties of day-trippers after the last ferry — evenings are quiet and lovely.","tr":"","m":true,"v":"","k":"meal"}]},{"iso":"2026-09-03","date":"Thu 3 Sep","title":"Benesse art core","leg":"Naoshima & Teshima","colour":"#0F6B63","hotel":"MY LODGE Naoshima — Miyanoura","blocks":[{"s":"09:30","e":"10:00","t":"Lee Ufan Museum","d":"Minimalist stone-and-metal installations in a Tadao Ando building.","tr":"Shuttle / walk","m":true,"v":"","k":"visit"},{"s":"10:15","e":"10:40","t":"Valley Gallery","d":"Kusama's Narcissus Garden — bundled with the Benesse House ticket.","tr":"WALK","m":true,"v":"","k":"visit"},{"s":"10:45","e":"11:45","t":"Benesse House Museum","d":"The original Ando museum-hotel, art integrated into the building itself.","tr":"WALK","m":true,"v":"","k":"visit"},{"s":"12:00","e":"13:00","t":"Lunch — Benesse café","d":"On-site, between the museums.","tr":"","m":true,"v":"","k":"meal"},{"s":"15:00","e":"16:30","t":"Chichu Art Museum — BOOKED","d":"Monet's Water Lilies in natural light, plus Turrell and De Maria. Booked for the afternoon deliberately — the light peaks then and it's quieter.","tr":"Walk / shuttle","m":true,"v":"","k":"visit"},{"s":"17:00","e":"17:45","t":"Hiroshi Sugimoto Gallery (optional, if time)","d":"","tr":"Time Corridors — a short add if the day feels easy.","m":true,"v":"","k":"transport"}]},{"iso":"2026-09-04","date":"Fri 4 Sep","title":"Teshima by e-bike","leg":"Naoshima & Teshima","colour":"#0F6B63","hotel":"MY LODGE Naoshima — Miyanoura","blocks":[{"s":"08:30","e":"09:15","t":"Ferry to Teshima","d":"","tr":"Ferry from Naoshima","m":true,"v":"","k":"transport"},{"s":"09:15","e":"09:30","t":"Rent e-bike at Ieura port","d":"~¥1,000 / 4 hrs — the island is a hilly 12 km loop, the bus is infrequent.","tr":"","m":true,"v":"","k":"visit"},{"s":"10:30","e":"11:45","t":"Teshima Art Museum — BOOKED","d":"A water-droplet concrete shell where springs move across the floor in near silence. Booked for 10:30 — seen fresh, before crowds.","tr":"E-bike to Karato","m":true,"v":"","k":"visit"},{"s":"12:00","e":"12:45","t":"Les Archives du Cœur","d":"Boltanski's archive of recorded heartbeats, on the Karato beach.","tr":"E-bike, nearby","m":true,"v":"","k":"visit"},{"s":"13:15","e":"14:00","t":"Lunch — Shima Kitchen or a beach café 📍 Open in Maps","d":"","tr":"","m":false,"v":"","k":"meal"},{"s":"14:30","e":"15:15","t":"Teshima Yokoo House","d":"A psychedelic colour-and-red-glass house back at Ieura.","tr":"E-bike back to Ieura","m":true,"v":"","k":"visit"},{"s":"17:35","e":"18:00","t":"Last ferry back to Naoshima","d":"","tr":"Watch this one — plan the day around it.","m":true,"v":"","k":"transport"}]},{"iso":"2026-09-05","date":"Sat 5 Sep","title":"Arrive Kyoto & southern Higashiyama","leg":"Kyoto","colour":"#1B6B4A","hotel":"Dusit Thani Kyoto — near Kyoto Station","blocks":[{"s":"11:00","e":"13:00","t":"Naoshima → Kyoto","d":"Ferry to Uno, train via Okayama, shinkansen to Kyoto. Check in at Dusit Thani. Ferry + JR + shinkansen (~2.5–3 h door to door)","tr":"","m":false,"v":"","k":"transport"},{"s":"13:30","e":"14:30","t":"Lunch near Kyoto Station","d":"Quick lunch — try a station kaiseki bento or Nishiki-style bites.","tr":"","m":true,"v":"mid","k":"meal"},{"s":"14:30","e":"15:30","t":"To-ji Temple","d":"Japan's tallest wooden pagoda (5 storeys, 55m). Calm, close to the hotel — a gentle first stop.","tr":"WALK ~15 min from Kyoto Station, or one stop on the Kintetsu line","m":true,"v":"mid","k":"visit"},{"s":"16:00","e":"18:00","t":"Higashiyama lanes","d":"Kiyomizu-dera — do the Tainai-meguri 'womb room' at Zuigū-dō (pitch-black descent, ~¥100, most walk past it). Downhill through Sannenzaka & Ninnenzaka; Rokuharamitsu-ji for the Kūya statue. Quirky snack en route: Issen Yoshoku (one-dish omelette-pancake, kimono-clad dolls at the tables).","tr":"Bus 100/206 or taxi to Kiyomizu-michi (~20 min)","m":true,"v":"tourist","k":"visit"},{"s":"18:00","e":"19:00","t":"Yasaka Shrine (lanterns at dusk)","d":"Time it for when the lanterns light up; wander the Maruyama Park side.","tr":"WALK down from Sannenzaka (~15 min)","m":true,"v":"tourist","k":"visit"},{"s":"19:15","e":"20:45","t":"Dinner — Charlie (izakaya) — BOOKED 7:15pm","d":"Lively downtown izakaya near Karasuma Oike — a relaxed first-night dinner. Confirmed via the Dusit Thani concierge for 7:15pm, 1 person.","tr":"WALK / short taxi to downtown","m":true,"v":"local","k":"meal"},{"s":"21:00","e":"22:15","t":"In the Moon (rooftop)","d":"Rooftop bar off Hanami-kōji over the Kamo River. Open from 6pm, fills fast — nightcap with a view.","tr":"WALK to Gion (~10 min)","m":true,"v":"mid","k":"bar"}]},{"iso":"2026-09-06","date":"Sun 6 Sep","title":"Fushimi Inari, sake district & Pontocho","leg":"Kyoto","colour":"#1B6B4A","hotel":"Dusit Thani Kyoto — near Kyoto Station","blocks":[{"s":"06:15","e":"06:30","t":"To Fushimi Inari (dawn)","d":"Leave the hotel early — the single biggest crowd-beater in Kyoto.","tr":"JR Nara Line to Inari (~5 min), or taxi","m":false,"v":"","k":"transport"},{"s":"06:30","e":"09:00","t":"Fushimi Inari — to the top","d":"Walk the Senbon Torii tunnels nearly alone. Climb through the thousand torii all the way to the 233m summit (2–3 hr loop); crowds thin past Yotsutsuji.","tr":"On foot","m":true,"v":"tourist","k":"transport"},{"s":"09:30","e":"10:00","t":"Breakfast/snack at the base","d":"Grilled quail, inari-zushi, or a coffee from the stalls by the shrine.","tr":"","m":true,"v":"mid","k":"meal"},{"s":"10:30","e":"12:30","t":"Fushimi sake district","d":"Historic breweries along the canals — Gekkeikan Ōkura Sake Museum, tastings, willow-lined waterways.","tr":"Keihan line to Fushimi-Momoyama / Chushojima (~10 min)","m":true,"v":"local","k":"visit"},{"s":"12:30","e":"13:30","t":"Lunch in Fushimi","d":"Sake-brewery restaurant or a local set-meal spot.","tr":"","m":true,"v":"mid","k":"meal"},{"s":"14:30","e":"15:45","t":"Sanjo street","d":"Browse the arcades and cafés along Sanjō; work back toward the river.","tr":"Keihan line to Sanjo (~15 min)","m":true,"v":"mid","k":"visit"},{"s":"15:45","e":"17:00","t":"Nishiki Market","d":"'Kyoto's kitchen' — graze pickles, tofu, sweets, skewers. Central (parallel to Shijō), easy add today.","tr":"WALK from Sanjo (~8 min)","m":true,"v":"tourist","k":"visit"},{"s":"17:00","e":"18:15","t":"Rest / freshen up","d":"Back to the hotel or a café before dinner.","tr":"","m":false,"v":"","k":"free"},{"s":"18:30","e":"20:30","t":"Dinner — Roan Kikunoi (kaiseki) — BOOKED 6:30pm","d":"Pontocho riverside kaiseki on a kawayuka terrace over the Kamo — the accessible sister of 3-star Kikunoi. Confirmed via the Dusit Thani concierge for 6:30pm, 1 person.","tr":"WALK, Pontocho area","m":true,"v":"mid","k":"meal"},{"s":"20:30","e":"21:00","t":"Stroll Pontocho Alley","d":"Wander the lantern-lit alley along the Kamo, right where you've just eaten — one of Kyoto's great evening walks. Early-ish night: tomorrow is a 6:30 Arashiyama start.","tr":"WALK","m":true,"v":"tourist","k":"visit"}]},{"iso":"2026-09-07","date":"Mon 7 Sep","title":"Arashiyama & the west","leg":"Kyoto","colour":"#1B6B4A","hotel":"Dusit Thani Kyoto — near Kyoto Station","blocks":[{"s":"06:00","e":"06:30","t":"To Arashiyama (leave hotel ~05:50)","d":"Dawn start — the whole point is having the grove to yourself.","tr":"JR Sagano Line to Saga-Arashiyama (~20 min), then walk ~10 min","m":false,"v":"","k":"transport"},{"s":"06:30","e":"08:15","t":"Arashiyama bamboo grove (6:30 arrival)","d":"Transcendent when empty, a shuffle by 10am. Wander slowly; the light through the stalks is best early.","tr":"On foot","m":true,"v":"tourist","k":"visit"},{"s":"08:30","e":"09:30","t":"Otagi Nenbutsu-ji","d":"1,200 stone rakan carved by amateur volunteers — grinning, grimacing, utterly bizarre faces scattered across the hillside. Genuinely uncanny at scale, and nearly empty.","tr":"Taxi/bus up from the grove (~10 min); return via the preserved Saga-Toriimoto street","m":true,"v":"local","k":"visit"},{"s":"09:45","e":"11:15","t":"Tenryū-ji + Ōkōchi Sansō","d":"The great Zen temple and pond garden, then the villa garden with views.","tr":"WALK back down","m":true,"v":"mid","k":"visit"},{"s":"11:30","e":"12:45","t":"Iwatayama Monkey Park (if energy allows)","d":"Short uphill climb; monkeys and a city panorama. Now has proper breathing room before the 1:30 Shōraian booking — or skip it and take the riverside slowly instead.","tr":"","m":true,"v":"mid","k":"visit"},{"s":"13:30","e":"15:15","t":"Lunch — Shōraian (tofu kaiseki) — BOOKED 1:30pm","d":"Tofu kaiseki in a 120-yr-old riverside villa above the Ōi River — Kyoto's signature yudofu/yuba, many courses, gorgeous views. Confirmed for 1:30pm (11:30 and 3:30 were the alternatives). Reservation essential — they turn away walk-ins. No under-13s.","tr":"WALK ~15 min upstream from Togetsukyo Bridge, then up steps","m":true,"v":"local","k":"meal"},{"s":"16:00","e":"17:30","t":"Kinkaku-ji (Golden Pavilion)","d":"The gold-leaf pavilion mirrored in its pond — last admission 17:00, so this is tighter after the later lunch. Ryōan-ji nearby as an alternative.","tr":"Bus/taxi across town (~40 min)","m":true,"v":"tourist","k":"visit"},{"s":"18:00","e":"18:50","t":"Back to the hotel + freshen up","d":"A proper break before dinner — shower off the day, change if you want to.","tr":"Taxi/bus back to the hotel","m":true,"v":"","k":"transport"},{"s":"19:15","e":"20:45","t":"Dinner — Iso Stand","d":"Friend-recommended: tasty food, great vibes. The mackerel is the speciality, but strong for meat and veg too. Back here since Shiro moved to Wed 5 Aug (it's only open Wed/ Thu/ Fri).","tr":"Taxi from the hotel (~10 min)","m":true,"v":"local","k":"meal"},{"s":"21:30","e":"23:00","t":"Jazz in Rokudenashi","d":"Legendary tiny jazz kissa — vinyl only, whisky highballs, <10 seats, smoky. Weeknight hours to midnight.","tr":"WALK, central Shimogyo (near Pontocho)","m":true,"v":"local","k":"bar"}]},{"iso":"2026-09-08","date":"Tue 8 Sep","title":"Nara day trip","leg":"Kyoto","colour":"#1B6B4A","hotel":"Dusit Thani Kyoto — near Kyoto Station","blocks":[{"s":"08:30","e":"09:15","t":"Kyoto → Nara","d":"","tr":"Kintetsu Limited Express to Kintetsu-Nara (~45 min)","m":false,"v":"","k":"transport"},{"s":"09:15","e":"10:30","t":"Tōdai-ji & the Great Buddha","d":"The world's largest bronze Buddha in a vast wooden hall. Deer roam the approach.","tr":"WALK into Nara Park","m":true,"v":"tourist","k":"visit"},{"s":"10:30","e":"11:15","t":"Nigatsu-dō","d":"The hillside hall behind Tōdai-ji, with a terrace view over Nara.","tr":"WALK uphill","m":true,"v":"mid","k":"visit"},{"s":"11:15","e":"12:15","t":"Kōfuku-ji","d":"Five-storey pagoda and National Treasure hall.","tr":"WALK","m":true,"v":"mid","k":"visit"},{"s":"12:15","e":"13:30","t":"Lunch in Naramachi","d":"Kakinoha-zushi (persimmon-leaf sushi) or somen in the old merchant quarter.","tr":"","m":true,"v":"mid","k":"meal"},{"s":"13:30","e":"15:00","t":"Kasuga Taisha","d":"Forest shrine lined with thousands of stone & bronze lanterns.","tr":"WALK through the park","m":true,"v":"mid","k":"visit"},{"s":"15:00","e":"16:00","t":"Wakakusayama hill","d":"Grassy hill for a panorama over Nara (short climb).","tr":"WALK","m":true,"v":"local","k":"visit"},{"s":"17:00","e":"17:45","t":"Nara → Kyoto","d":"","tr":"Kintetsu Limited Express (~45 min)","m":false,"v":"","k":"transport"},{"s":"19:15","e":"21:15","t":"Dinner — Hikiniku to Come — BOOKED 7:15pm","d":"The cult hand-minced hamburg-steak spot — confirmed reservation, confirmation #RUEAWA.","tr":"In Kyoto","m":true,"v":"mid","k":"meal"},{"s":"21:30","e":"23:00","t":"Bar Talisker or El Tesoro","d":"Post-dinner nightcap, pick one: Bar Talisker (intimate whisky bar) or El Tesoro (classic cocktail bar, Kiyamachi area).","tr":"WALK, central Kyoto","m":true,"v":"mid","k":"bar"}]},{"iso":"2026-09-09","date":"Wed 9 Sep","title":"Ginkaku-ji, Daitoku-ji & Nijō","leg":"Kyoto","colour":"#1B6B4A","hotel":"Dusit Thani Kyoto — near Kyoto Station","blocks":[{"s":"07:45","e":"08:25","t":"Breakfast — Arabica Shokudo","d":"The %Arabica food/coffee spot — your friend's breakfast pick. Latte + a bite before the northern loop. On the way / short detour","tr":"","m":true,"v":"","k":"meal"},{"s":"08:30","e":"09:00","t":"To Ginkaku-ji","d":"","tr":"Bus 5/17 or taxi (~25 min)","m":false,"v":"","k":"transport"},{"s":"09:00","e":"10:00","t":"Ginkaku-ji (Silver Pavilion)","d":"Refined sand garden and moss grounds.","tr":"WALK","m":true,"v":"tourist","k":"visit"},{"s":"10:00","e":"11:15","t":"Philosopher's Path & Nanzen-ji","d":"Canal walk south to Nanzen-ji's brick aqueduct.","tr":"WALK (flat, shaded)","m":true,"v":"mid","k":"visit"},{"s":"11:15","e":"11:55","t":"To Murasakino (Daitoku-ji area)","d":"Cross-city hop northwest. Kokage opens 11:30 and closes at 14:00 — aim to arrive close to opening.","tr":"Kyoto City Bus 206 to \"Daitokuji-mae\", or taxi (~25-30 min)","m":false,"v":"","k":"transport"},{"s":"12:00","e":"13:15","t":"Lunch — Kokage (soba) — WALK-IN ONLY","d":"2026 Bib Gourmand. Thin-cut juwari (100% buckwheat) soba from house-milled flour; the chef is a former pâtissière who switched to soba to do one thing well. Replaces Juugo, closed while you are here. NO RESERVATIONS — 12 seats only (4 counter, 8 table), so arrive near the 11:30 opening. Open Mon/Tue/Wed/Sat/Sun 11:30–14:00, closed Thu/Fri. ~¥1,000–2,000. Card, IC and QR accepted. Irregular closures happen — check their Instagram the day before.","tr":"5-min walk from \"Daitokuji-mae\" bus stop; 907m from Kitaoji Stn","m":true,"v":"local","k":"meal"},{"s":"13:25","e":"14:45","t":"Daitoku-ji sub-temples","d":"Five minutes from Kokage — a large walled Zen complex of two dozen sub-temples, several with celebrated dry gardens (Daisen-in, Zuihō-in, Kōtō-in). Quiet, and it turns the lunch detour into a proper stop.","tr":"WALK ~5 min","m":true,"v":"local","k":"visit"},{"s":"15:15","e":"16:30","t":"Nijō Castle","d":"Shogun's residence; 'nightingale' floors that chirp underfoot.","tr":"Bus/taxi south from Daitoku-ji (~20 min), or Karasuma Line + Tozai Line","m":true,"v":"tourist","k":"visit"},{"s":"16:50","e":"17:50","t":"Tea ceremony (NOT yet booked)","d":"A proper matcha ceremony — STILL TO BOOK, reserve a slot ahead. (Nishiki done on Day 18.) Forward luggage to Tokyo today. Central Kyoto","tr":"","m":true,"v":"mid","k":"visit"},{"s":"18:30","e":"20:30","t":"Dinner — Shiro (Karasuma Oike) — prompt 18:30 start","d":"Michelin 1-star, newly awarded — Japanese technique applied to Italian-leaning cuisine, a minimalist all-white room, tiny (counter + 2 tables). Open Wed/Thu/Fri only, with a prompt 18:30 start — don't be late. Book ahead.","tr":"WALK/taxi, central Kyoto","m":true,"v":"local","k":"meal"}]},{"iso":"2026-09-10","date":"Thu 10 Sep","title":"Kyoto → Hakone","leg":"Mount Fuji & Hakone","colour":"#A8620F","hotel":"Hotel Indigo Hakone Gora by IHG","blocks":[{"s":"10:00","e":"13:30","t":"Kyoto → Hakone","d":"Shinkansen to Odawara, then the local line up into the hills. No Fuji climb this trip — straight to the onsen.","tr":"TōkaidōShinkansen to Odawara, then Hakone Tozan line/bus (~3 h door to door)","m":false,"v":"","k":"transport"},{"s":"15:00","e":"17:00","t":"Check in + rest","d":"Ryokan with a private rotenburo — exactly what wrecked legs want.","tr":"","m":true,"v":"","k":"free"},{"s":"18:30","e":"20:30","t":"Kaiseki dinner + rotenburo soak","d":"A seasonal multi-course dinner and a long, private open-air bath.","tr":"At the ryokan","m":true,"v":"","k":"meal"}]},{"iso":"2026-09-11","date":"Fri 11 Sep","title":"Hakone onsen loop","leg":"Mount Fuji & Hakone","colour":"#A8620F","hotel":"Hotel Indigo Hakone Gora by IHG","blocks":[{"s":"09:00","e":"10:30","t":"Owakudani (ropeway)","d":"Volcanic valley, sulphur vents, the famous black eggs high over the valley.","tr":"Hakone Ropeway","m":true,"v":"","k":"visit"},{"s":"11:00","e":"12:30","t":"Lake Ashi pirate ship","d":"On a clear day, Fuji reflected in the lake — seen from below the summit you climbed.","tr":"Sightseeing boat","m":true,"v":"","k":"visit"},{"s":"13:00","e":"14:00","t":"Lunch on the lake","d":"Hakone soba, or a lakeside café.","tr":"","m":true,"v":"","k":"meal"},{"s":"14:30","e":"16:30","t":"Hakone Open-Air Museum","d":"","tr":"Henry Moore sculptures, a Picasso pavilion, a stained-glass tower. Hakone Tozan train / bus","m":true,"v":"","k":"visit"},{"s":"18:00","e":"20:00","t":"Second onsen night","d":"Recovery pace; another long soak, kaiseki dinner.","tr":"At the ryokan","m":true,"v":"","k":"visit"}]},{"iso":"2026-09-12","date":"Sat 12 Sep","title":"Hakone → Tokyo, Marunouchi","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C","hotel":"Andaz Tokyo — Toranomon Hills","blocks":[{"s":"09:30","e":"12:00","t":"Hakone → Tokyo","d":"Down from the hills and back into the city; check in and drop the bags before the afternoon.","tr":"Hakone Tozan / bus to Odawara, then TōkaidōShinkansen (~1h45 total)","m":false,"v":"","k":"transport"},{"s":"12:30","e":"13:30","t":"Check in — Andaz Tokyo","d":"Collect the bag you forwarded ahead. Toranomon Hills — Ginza and Tokyo Station are a short hop.","tr":"WALK from Tokyo Station (Marunouchi side)","m":true,"v":"","k":"free"},{"s":"14:00","e":"16:30","t":"Tokyo National Museum + Ueno Park","d":"Japan's oldest and largest museum: samurai armour and swords, Buddhist sculpture, ukiyo-e, National Treasures — the Honkan (Japanese Gallery) is the priority if time is short. The museum sits inside Ueno Park itself, so fold in a stroll: Shinobazu Pond, Toshogu Shrine, and the park's other museums (Western Art, Science) are all a few minutes' walk if you want to extend beyond the 2.5 hrs.","tr":"JR Yamanote to Ueno (~10 min), then WALK into the park","m":true,"v":"mid","k":"visit"},{"s":"17:00","e":"17:45","t":"Back to the hotel + rest","d":"Yamanote back from Ueno; quick pool time if there's a moment before dinner.","tr":"","m":false,"v":"","k":"transport"},{"s":"18:00","e":"19:00","t":"Tokyo Confidential (pre-dinner)","d":"Rooftop sake bar with Tokyo Tower framed in the window — better before dark than after; catches the light change. Moved here from after dinner, per preference for livelier spots later.","tr":"Taxi ~5 min / walk ~15","m":true,"v":"mid","k":"meal"},{"s":"20:00","e":"22:00","t":"Dinner — Ningyōchō Imahan (branch TBC)","d":"Sukiyaki done ceremonially — wagyu swished at the table by kimono-clad staff. Branch still open: asked the Four Seasons concierge whether Nihonbashi Takashimaya or Ueno is closer, and whether quality holds up across branches. Awaiting reply.","tr":"Taxi ~10 min / Hibiya Line to Ningyōchō","m":true,"v":"mid","k":"meal"},{"s":"21:45","e":"23:00","t":"Nearby izakaya, Ningyōchō/Nihombashi","d":"After the ceremony of sukiyaki, something looser: the small local izakaya lanes around Ningyōchō — lively, unfussy, real.","tr":"WALK, same area as dinner","m":true,"v":"local","k":"visit"}]},{"iso":"2026-09-13","date":"Sun 13 Sep","title":"Meiji, Harajuku & Akihabara","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C","hotel":"Andaz Tokyo — Toranomon Hills","blocks":[{"s":"08:15","e":"09:00","t":"Breakfast — Flippers (Shibuya)","d":"The soufflé-pancake fix — mornings are calmest before the queue builds. A short walk from the hotel.","tr":"WALK, Shibuya","m":true,"v":"mid","k":"meal"},{"s":"09:15","e":"10:30","t":"Meiji Shrine","d":"A forest of 100,000 donated trees in the city's heart. Sunday morning sometimes brings a wedding procession across the gravel courtyard. Yoyogi Park is next door for green sprawl.","tr":"WALK ~15 min from the hotel","m":true,"v":"tourist","k":"visit"},{"s":"10:30","e":"12:30","t":"Harajuku on a Sunday — just watch","d":"Not really a venue, just a place to stand: Sunday is when Harajuku's spontaneous street culture comes out — matching-outfit gangs, dance battles, kids in Victorian lolita fashion, the occasional Elvis. Completely real, completely unscripted. Takeshita St for the teen strip, then Omotesando's calmer architecture avenue.","tr":"WALK","m":true,"v":"mid","k":"visit"},{"s":"12:30","e":"13:15","t":"Quick lunch — Harajuku Gyozarou","d":"Cult cheap gyoza, crisp-bottomed; the queue moves fast. Keep it brisk today — Borderless entry is at 14:00.","tr":"WALK, Harajuku","m":true,"v":"","k":"meal"},{"s":"14:30","e":"18:00","t":"Akihabara","d":"Electronics, anime and retro-gaming district — multi-storey games shops, arcades, and specialist manga floors. A browsing afternoon rather than a fixed itinerary; go at whatever pace suits.","tr":"JR Yamanote / Chiyoda Line to Akihabara (~25 min)","m":true,"v":"tourist","k":"bar"}]},{"iso":"2026-09-14","date":"Mon 14 Sep","title":"Kamakura day trip & Roppongi","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C","hotel":"Andaz Tokyo — Toranomon Hills","blocks":[{"s":"08:30","e":"09:30","t":"Tokyo → Kamakura","d":"","tr":"JR Yokosuka Line direct from Tokyo Station (~1 h)","m":false,"v":"","k":"transport"},{"s":"09:30","e":"11:00","t":"Great Buddha + Hase-dera","d":"The 13m bronze Daibutsu in the open air, then Hase-dera's hillside Kannon hall and sea view. Enoden to Hase, then walk","tr":"","m":true,"v":"tourist","k":"visit"},{"s":"11:30","e":"12:30","t":"Lunch — Komachi-dōri","d":"Kamakura's snack street: shirasu-don, croquettes, matcha soft-serve.","tr":"WALK","m":true,"v":"tourist","k":"meal"},{"s":"13:00","e":"15:00","t":"Hōkoku-ji bamboo + Enoden coast","d":"Matcha in the small bamboo grove, then ride the vintage Enoden tram along the sea toward Enoshima.","tr":"Bus to Hōkoku-ji; Enoden after","m":true,"v":"mid","k":"visit"},{"s":"16:30","e":"17:45","t":"Back to Tokyo","d":"","tr":"JR Yokosuka Line","m":false,"v":"","k":"transport"},{"s":"19:30","e":"21:30","t":"Dinner — Roppongi Mon cher ton ton — BOOKED","d":"Teppanyaki wagyu at the counter — Wagyu Sirloin course, ¥26,400 (+¥2,640 service, ¥29,040 total, prepaid refundable deposit). 1 person, counter seating. Reservation ID FF2WA2. 3-12-2 Roppongi B1F, Minato-ku. Tel 03-3402-1055.","tr":"Hibiya/Ōedo Line to Roppongi from central Tokyo (~20 min)","m":true,"v":"mid","k":"meal"}]},{"iso":"2026-09-15","date":"Tue 15 Sep","title":"Toyosu, Omotesando & teamLab Planets","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C","hotel":"Andaz Tokyo — Toranomon Hills","blocks":[{"s":"07:15","e":"08:15","t":"Sushi breakfast, Toyosu","d":"The classic pairing — several excellent sushi counters inside the market serve breakfast omakase using what just sold. Order lightly; there's a long day ahead.","tr":"WALK inside the market","m":true,"v":"mid","k":"meal"},{"s":"09:00","e":"10:30","t":"Back to the hotel + rest","d":"A long start — worth an hour to reset before DAWN.","tr":"Yurikamome + walk (~30 min)","m":true,"v":"","k":"transport"},{"s":"11:00","e":"12:15","t":"DAWN Avatar Robot Cafe, Nihonbashi","d":"Served by small OriHime robots, each one remotely operated in real time by a person with a disability who can't leave home — you chat with them live through the robot. Wholesome and deeply strange at once. BOOK the OriHime Diner slot ahead via TableCheck — no same-day bookings, and it's closed Thursdays. Short taxi/metro from the hotel (~10 min) — Nihonbashi is right by Marunouchi","tr":"","m":true,"v":"local","k":"visit"},{"s":"12:45","e":"13:45","t":"To Omotesando + lunch","d":"Cross town to Omotesando; a brunch room, or hold hunger for Ginza later.","tr":"Chiyoda Line, ~20–25 min","m":true,"v":"mid","k":"meal"},{"s":"14:00","e":"15:00","t":"Omotesando stroll + APFR","d":"The architecture avenue (Prada, Tod's), with a stop at APFR — the Japanese incense/fragrance house — for a distinctive gift.","tr":"WALK","m":true,"v":"mid","k":"visit"},{"s":"15:00","e":"17:30","t":"teamLab Planets, Toyosu","d":"Barefoot through water-and-light rooms — BOOKED timed slot needed; wear shorts or roll-ups, leave bags at the hotel. Lockers inside are limited. Back to Toyosu, but worth it.","tr":"Shuttle bus from GINZA SIX, or Yurikamome to Shin-Toyosu (1-min walk)","m":true,"v":"tourist","k":"visit"},{"s":"19:30","e":"21:30","t":"Dinner — Den, Jingumae (PENDING availability)","d":"Two Michelin stars, playful rather than stuffy — foie gras 'monaka', 'Dentucky Fried Chicken'. Checking availability directly with Den for this date — not yet confirmed. If it doesn't come through, Gohanya Isshin (charcoal yakitori, concierge pick) is the fallback. Last entry 20:00, so timing is tight after Planets — go straight there.","tr":"Taxi from Toyosu (~30-40 min)","m":true,"v":"mid","k":"meal"},{"s":"21:45","e":"23:00","t":"Nonbei-style standing bar, Yūrakuchō","d":"After the long Toyosu-to-Ginza day, something lively and local rather than a quiet cocktail room: the yakitori-arch standing bars under the Yūrakuchō/Ginza train tracks — cheap highballs, salarymen unwinding, loud and real.","tr":"WALK ~10 min from Gohanya Isshin","m":true,"v":"mid","k":"bar"}]},{"iso":"2026-09-16","date":"Wed 16 Sep","title":"Sumo — Aki Basho, Day 4","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C","hotel":"Four Seasons Tokyo","blocks":[{"s":"08:45","e":"09:30","t":"Transfer — Andaz → Four Seasons","d":"Early checkout from the Andaz and across to the Four Seasons — leave the bags with the concierge rather than waiting for the room, so you can get out to Ryōgoku.","tr":"Taxi ~15 min","m":false,"v":"","k":"transport"},{"s":"09:45","e":"10:20","t":"To Ryōgoku Kokugikan","d":"The sumo hall is a two-minute walk from Ryōgoku Station’s west exit — follow the crowd and the banners.","tr":"JR Chūō-Sōbu Line from Tokyo/Akihabara (~15 min)","m":true,"v":"","k":"transport"},{"s":"10:30","e":"15:30","t":"Sumo — lower divisions & build-up","d":"Box seat (masu-seki), C area, 1st floor — the box is yours for the whole day, so arriving late morning is fine. The hall is quiet now: juryo and lower-division bouts, sparse crowd, easy to wander, photograph and get your bearings. You sit on cushions on the floor — shoes off, legs folded. ¥65,000 + ¥8,000 handling. NON-REFUNDABLE, date cannot be changed.","tr":"","m":true,"v":"tourist","k":"visit"},{"s":"12:30","e":"13:15","t":"Lunch — chanko nabe, B1F","d":"The wrestlers’ stew, served in the Kokugikan basement — the thing to eat here, and you can keep your box. Yakitori from the basement kitchen is the other institution. Replaces the Ponchi-ken lunch, now moved to Friday.","tr":"Inside the Kokugikan","m":false,"v":"tourist","k":"meal"},{"s":"15:30","e":"15:45","t":"Makuuchi dōhyō-iri — ring-entering ceremony","d":"The top-division wrestlers circle the ring in ornate keshō-mawashi aprons, followed by the yokozuna’s own ceremony. This is the moment the hall fills and the noise changes — don’t be away from your seat.","tr":"","m":false,"v":"tourist","k":"visit"},{"s":"15:45","e":"18:00","t":"Sumo — makuuchi (top division)","d":"The bouts everyone comes for, building to the final match of the day and the yumitori-shiki bow-twirling ceremony at around 18:00. Each bout is seconds long; the ritual around it is the point.","tr":"","m":false,"v":"tourist","k":"visit"},{"s":"18:10","e":"18:40","t":"Back to Marunouchi","d":"Straight back — dinner is a short walk from the hotel.","tr":"JR Chūō-Sōbu Line (~15 min)","m":false,"v":"","k":"transport"},{"s":"19:30","e":"21:00","t":"Dinner — Manten Marunouchi (sushi)","d":"Sushi omakase five minutes from the hotel — an easy walk back after a long day at the sumo. Moved from 18:30 to 19:30 so you can stay for the final bouts and the bow-twirling ceremony. Not yet booked.","tr":"WALK from the hotel","m":true,"v":"mid","k":"meal"}]},{"iso":"2026-09-17","date":"Thu 17 Sep","title":"Meguro & Daikanyama","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C","hotel":"Four Seasons Tokyo","blocks":[{"s":"08:30","e":"09:15","t":"Breakfast — Oreno Bakery or I'm Donut?","d":"Two Ebisu/Nakameguro friend picks: Oreno Bakery ('incredible food') or the original I'm Donut? counter.","tr":"Hibiya Line to Ebisu / Nakameguro","m":true,"v":"local","k":"meal"},{"s":"09:30","e":"10:45","t":"Nakameguro canal","d":"Plane-tree canal walk, indie shops waking up.","tr":"WALK","m":true,"v":"mid","k":"visit"},{"s":"11:00","e":"13:00","t":"Daikanyama: T-Site + the shops","d":"Tsutaya Books' beautiful campus (café inside), Saturdays NYC, and your APPOINTMENT at Makers Pride of Craft for custom denim — book the slot ahead.","tr":"WALK ~12 min from Nakameguro","m":true,"v":"mid","k":"visit"},{"s":"13:15","e":"14:30","t":"Lunch — Pizza Marumo","d":"Acclaimed neo-Neapolitan in Ebisu — the friend lunch/dinner rec, easier at lunch.","tr":"WALK / one stop","m":true,"v":"local","k":"meal"},{"s":"15:00","e":"17:30","t":"Kagurazaka or rest","d":"Stone-paved backstreets and a slow coffee, or pool time before the big dinner.","tr":"Metro","m":true,"v":"","k":"free"},{"s":"19:00","e":"21:00","t":"Dinner — HIGASHI-YAMA (Meguro)","d":"A serene 10-course tasting menu in a beautifully renovated grand home. Chosen over Sushi Tou, which — like Den — is also closed Sundays. Genuinely fits today's neighbourhood better anyway, being close to Nakameguro/Daikanyama rather than a taxi to Nishi-Azabu. Book ahead.","tr":"Short taxi from Nakameguro (~5-10 min)","m":true,"v":"mid","k":"meal"}]},{"iso":"2026-09-18","date":"Fri 18 Sep","title":"Ginza & farewell","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C","hotel":"Four Seasons Tokyo","blocks":[{"s":"10:00","e":"11:00","t":"Kiya Nihonbashi — knives & chopsticks","d":"Historic kitchenware house (est. 1792), a few minutes from the hotel. Fine Japanese knives and beautifully made chopsticks — an easier, more central alternative to trekking back to Kappabashi.","tr":"WALK ~12 min from the hotel","m":true,"v":"local","k":"visit"},{"s":"11:15","e":"12:45","t":"Ginza — Chūō-dōri shopping day","d":"The flagship spine: GINZA SIX, Itoya stationery, the depachika basements for beautiful edible gifts. Also on this street: the RIMOWA flagship — two floors, the Zen-garden- inspired store, for a new suitcase.","tr":"WALK ~8 min from the hotel","m":true,"v":"tourist","k":"visit"},{"s":"13:00","e":"14:15","t":"Lunch — Ponchi-ken (tonkatsu)","d":"Michelin-guide tonkatsu near Tokyo Station — go right at opening, the queue forms fast. Adds tonkatsu to the trip, a gap that was otherwise missing.","tr":"WALK/short taxi from Marunouchi","m":true,"v":"mid","k":"meal"},{"s":"14:30","e":"17:00","t":"Open afternoon — last free time","d":"Still deliberately unbooked. Anywhere you spotted earlier and want to go back to, or simply keep drifting through Ginza and Nihombashi — both are on the hotel’s doorstep.","tr":"","m":false,"v":"","k":"free"},{"s":"17:00","e":"18:15","t":"Repack + ship anything oversized","d":"Last chance to send purchases home — the hotel arranges international shipping or airport takkyubin.","tr":"","m":false,"v":"","k":"free"},{"s":"19:30","e":"21:30","t":"Farewell dinner — Tempura Kondo — BOOKED 7:30pm","d":"One-star Ginza tempura, vegetables especially — the classic Tokyo send-off. CONFIRMED via the Four Seasons Marunouchi concierge for 1 person, 7:30pm. Outstanding: they have asked you to advise on dietary restrictions.","tr":"WALK ~8 min","m":true,"v":"mid","k":"meal"},{"s":"21:45","e":"23:00","t":"Farewell drink — lively, not fancy","d":"In keeping with the trip's better nightcaps: a standing izakaya or listening bar near the hotel rather than a rooftop. Nihonbashi/Yaesu has good yokocho-style alleys a short walk from The Peninsula — ask the concierge for whichever is liveliest that night.","tr":"WALK ~10 min","m":true,"v":"mid","k":"visit"}]},{"iso":"2026-09-19","date":"Sat 19 Sep","title":"Fly to Seoul","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C","hotel":"Four Seasons Tokyo","blocks":[{"s":"08:00","e":"08:45","t":"Pack + checkout","d":"Confirmed: departing NARITA (NRT) at 14:00. For an international flight, aim to be airport-side by ~11:00–11:15 — that means leaving the hotel by ~09:15.","tr":"","m":false,"v":"","k":"free"},{"s":"09:00","e":"09:15","t":"To Tokyo Station","d":"","tr":"WALK / short taxi from The Peninsula (~10 min)","m":false,"v":"","k":"transport"},{"s":"09:15","e":"10:20","t":"N'EX to Narita","d":"Reserved seat if you can; ~60 min direct to the airport.","tr":"JR Narita Express from Tokyo Station","m":true,"v":"","k":"transport"},{"s":"10:20","e":"13:30","t":"Check-in, security, immigration","d":"International departures want real buffer — this gives ~3.5 hrs, generous but safe for August queues. Last konbini/duty-free browse.","tr":"","m":true,"v":"","k":"free"},{"s":"14:00","e":"16:35","t":"Fly Tokyo → Seoul","d":"~2h35 flight; Korea is the same time zone as Japan, so no clock change on arrival. End of the Japan leg.","tr":"","m":false,"v":"","k":"transport"}]}],"tracker":[{"iso":"2026-08-24","date":"Mon 24 Aug","meal":"D","name":"Yakitori Shinohara (Nishi-Azabu)","status":"todo","leg":"Tokyo — Arrival","colour":"#A61C1C"},{"iso":"2026-08-25","date":"Tue 25 Aug","meal":"L","name":"in Kuramae","status":"walkin","leg":"Tokyo — Arrival","colour":"#A61C1C"},{"iso":"2026-08-25","date":"Tue 25 Aug","meal":"D","name":"Gohan Ya Isshin, Daikanyama — BOOKED","status":"booked","leg":"Tokyo — Arrival","colour":"#A61C1C"},{"iso":"2026-08-26","date":"Wed 26 Aug","meal":"L","name":"Kamachiku (udon)","status":"todo","leg":"Tokyo — Arrival","colour":"#A61C1C"},{"iso":"2026-08-26","date":"Wed 26 Aug","meal":"D","name":"Omoide Yokocho izakaya-hop","status":"todo","leg":"Tokyo — Arrival","colour":"#A61C1C"},{"iso":"2026-08-27","date":"Thu 27 Aug","meal":"D","name":"Afuri Roppongi (ramen)","status":"todo","leg":"Tokyo — Arrival","colour":"#A61C1C"},{"iso":"2026-08-28","date":"Fri 28 Aug","meal":"L","name":"Mizuno (okonomiyaki)","status":"walkin","leg":"Osaka","colour":"#144A8C"},{"iso":"2026-08-29","date":"Sat 29 Aug","meal":"L","name":"Himeji arcades","status":"walkin","leg":"Osaka","colour":"#144A8C"},{"iso":"2026-08-30","date":"Sun 30 Aug","meal":"L","name":"near Minoo","status":"walkin","leg":"Osaka","colour":"#144A8C"},{"iso":"2026-08-30","date":"Sun 30 Aug","meal":"D","name":"street food graze, Kita","status":"walkin","leg":"Osaka","colour":"#144A8C"},{"iso":"2026-08-31","date":"Mon 31 Aug","meal":"L","name":"Hiroshima okonomiyaki","status":"walkin","leg":"Osaka","colour":"#144A8C"},{"iso":"2026-08-31","date":"Mon 31 Aug","meal":"D","name":"Kawafuku Honten (udon)","status":"todo","leg":"Osaka","colour":"#144A8C"},{"iso":"2026-09-01","date":"Tue 1 Sep","meal":"L","name":"Moegi (okonomiyaki)","status":"todo","leg":"Osaka","colour":"#144A8C"},{"iso":"2026-09-01","date":"Tue 1 Sep","meal":"D","name":"Ajikitchō Bunbu-an — BOOKED 19:00","status":"booked","leg":"Osaka","colour":"#144A8C"},{"iso":"2026-09-03","date":"Thu 3 Sep","meal":"L","name":"Benesse café","status":"todo","leg":"Naoshima & Teshima","colour":"#0F6B63"},{"iso":"2026-09-04","date":"Fri 4 Sep","meal":"L","name":"Shima Kitchen or a beach café 📍 Open in Maps","status":"todo","leg":"Naoshima & Teshima","colour":"#0F6B63"},{"iso":"2026-09-05","date":"Sat 5 Sep","meal":"L","name":"near Kyoto Station","status":"walkin","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-05","date":"Sat 5 Sep","meal":"D","name":"Charlie (izakaya) — BOOKED 7:15pm","status":"booked","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-06","date":"Sun 6 Sep","meal":"L","name":"in Fushimi","status":"walkin","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-06","date":"Sun 6 Sep","meal":"D","name":"Roan Kikunoi (kaiseki) — BOOKED 6:30pm","status":"booked","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-07","date":"Mon 7 Sep","meal":"L","name":"Shōraian (tofu kaiseki) — BOOKED 1:30pm","status":"booked","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-07","date":"Mon 7 Sep","meal":"D","name":"Iso Stand","status":"todo","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-08","date":"Tue 8 Sep","meal":"L","name":"in Naramachi","status":"walkin","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-08","date":"Tue 8 Sep","meal":"D","name":"Hikiniku to Come — BOOKED 7:15pm","status":"booked","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-09","date":"Wed 9 Sep","meal":"L","name":"Kokage (soba) — WALK-IN ONLY","status":"walkin","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-09","date":"Wed 9 Sep","meal":"D","name":"Shiro (Karasuma Oike) — prompt 18:30 start","status":"todo","leg":"Kyoto","colour":"#1B6B4A"},{"iso":"2026-09-11","date":"Fri 11 Sep","meal":"L","name":"on the lake","status":"todo","leg":"Mount Fuji & Hakone","colour":"#A8620F"},{"iso":"2026-09-12","date":"Sat 12 Sep","meal":"D","name":"Ningyōchō Imahan (branch TBC)","status":"pending","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C"},{"iso":"2026-09-13","date":"Sun 13 Sep","meal":"L","name":"Harajuku Gyozarou","status":"todo","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C"},{"iso":"2026-09-14","date":"Mon 14 Sep","meal":"L","name":"Komachi-dōri","status":"walkin","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C"},{"iso":"2026-09-14","date":"Mon 14 Sep","meal":"D","name":"Roppongi Mon cher ton ton — BOOKED","status":"booked","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C"},{"iso":"2026-09-15","date":"Tue 15 Sep","meal":"D","name":"Den, Jingumae (PENDING availability)","status":"pending","leg":"Tokyo — Finish (Andaz)","colour":"#A61C1C"},{"iso":"2026-09-16","date":"Wed 16 Sep","meal":"L","name":"chanko nabe, B1F","status":"walkin","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C"},{"iso":"2026-09-16","date":"Wed 16 Sep","meal":"D","name":"Manten Marunouchi (sushi)","status":"todo","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C"},{"iso":"2026-09-17","date":"Thu 17 Sep","meal":"L","name":"Pizza Marumo","status":"todo","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C"},{"iso":"2026-09-17","date":"Thu 17 Sep","meal":"D","name":"HIGASHI-YAMA (Meguro)","status":"todo","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C"},{"iso":"2026-09-18","date":"Fri 18 Sep","meal":"L","name":"Ponchi-ken (tonkatsu)","status":"todo","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C"},{"iso":"2026-09-18","date":"Fri 18 Sep","meal":"D","name":"Tempura Kondo — BOOKED 7:30pm","status":"booked","leg":"Tokyo — Finish (Four Seasons)","colour":"#A61C1C"}]}, GL=[["Omakase","“I leave it up to you.” The chef serves a set sequence — you don’t order. Price fixed, menu not."],["Kaiseki","Formal multi-course seasonal cooking, descended from the tea ceremony. Japan’s haute cuisine."],["Izakaya","A Japanese pub. Drink and order small plates continuously rather than having courses."],["Yakitori","Chicken grilled on skewers over binchōtan charcoal. Serious places use every part of the bird."],["Okonomiyaki","Savoury cabbage pancake on a griddle. Osaka mixes it; Hiroshima layers it with noodles."],["Teppanyaki","Cooked on a flat iron griddle in front of you — usually premium beef."],["Sukiyaki","Thin beef cooked at the table in sweet soy broth, dipped in raw egg."],["Tempura","Light-battered seafood and vegetables, served piece by piece as it leaves the oil."],["Soba","Buckwheat noodles. Juwari means 100% buckwheat, no wheat binder — harder to make, more prized."],["Udon","Thick soft wheat noodles. Zaru udon is the cold version with dipping sauce."],["Yudofu / yuba","Kyoto tofu tradition — simmered tofu, and the delicate skin lifted off warm soy milk."],["Konamon","Osaka slang for “flour things” — okonomiyaki, takoyaki, kushikatsu. Its street-food culture."],["Kushikatsu","Skewered, breadcrumbed, deep-fried. Shinsekai speciality — no double-dipping the sauce."],["Chirashi","Sashimi scattered over vinegared rice."],["Tamagoyaki","Rolled layered omelette, slightly sweet. A sushi-counter benchmark."],["Yokocho","An alley of tiny bars under railway tracks. Six to ten seats each; you hop between them."],["Kissaten","Old-school Japanese coffee house — dim, wood, jazz. Not a modern café."],["Depachika","The food hall in a department store basement. Extraordinary quality."],["Kawayuka","A wooden platform over a river for summer dining in Kyoto. May–September."],["Binchōtan","Premium white charcoal — hot, almost smokeless. Why good yakitori tastes different."],["Shojin ryori","Buddhist temple vegetarian cooking. The root of Kyoto’s tofu tradition."],["Ekiben","A station bento, bought for train journeys. Often regional — part of shinkansen travel."]], TRAVEL=[["Google Maps","Best all-round for Japan transit — live times, platform numbers, station exits. What every link in this app opens.",""],["Japan Travel by NAVITIME","Route finder with rail-pass filtering and offline saved routes. The main Hyperdia replacement.","https://japantravel.navitime.com/en/area/jp/route/"],["Jorudan Japan Transit","The other main route planner — clearer on why one route costs more than another.","https://world.jorudan.co.jp/mln/en/"],["Smart EX — shinkansen","Book Tōkaidō/Sanyō shinkansen seats and tap through the gate with a linked IC card. Covers all five bullet-train legs.","https://smart-ex.jp/en/"],["JR-EAST eki-net","Narita Express seat reservations for departure day — worth it rather than queueing with luggage.","https://www.eki-net.com/en/"],["Kintetsu — Kyoto–Nara","Limited Express reservations for the Nara day trip. The unreserved Express needs no booking — just tap your IC card.","https://www.kintetsu.co.jp/foreign/english/"],["Suica in Apple Wallet","Add a Suica and top up by card in-app. Works on almost every metro, JR line and bus nationwide, and in konbini.",""],["Hyperdia — skip it","Discontinued its timetable search in 2022. Older guides still recommend it; it no longer returns real departure times.",""]];
const V={local:['#2E7D32','more local'],mid:['#C99A1E','mixed crowd'],tourist:['#C0392B','touristy']};
const K={meal:['#C55A11','\u25CF'],bar:['#2E75B6','\u25CF'],transport:['#8A8A8A','\u25CF'],free:['#8A8A8A','\u25CB'],visit:['#2E8B57','\u25CF']};
const LBL={booked:'Booked',pending:'Awaiting',todo:'To book',walkin:'Walk-in'};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=n=>n.replace(/\s*[—-]\s*(BOOKED|REQUESTED|PENDING)[^,]*/i,'').replace(/\s*\((PENDING|REQUESTED)[^)]*\)/i,'').replace(/\s*—\s*WALK-IN ONLY/i,'').trim();
const tim=n=>{const m=n.match(/(\d{1,2}[:.]\d{2}\s*(?:am|pm)?)/i);return m?m[1]:''};
const dirs=t=>{const parts=t.split('→').map(x=>x.replace(/\([^)]*\)/g,'').replace(/^(Land|To|Back to|Train to|Ferry to|Bus to)\s+/i,'').trim()).filter(Boolean); if(parts.length<2)return null; return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(parts[0]+' Japan')+'&destination='+encodeURIComponent(parts[parts.length-1]+' Japan')+'&travelmode=transit'};
const gmap=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+' Japan');
const mins=t=>+t.slice(0,2)*60 + +t.slice(3);
let tab='today', cur=0;
function todayIdx(){const n=new Date(),z=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
 const i=D.days.findIndex(d=>d.iso===z); return i;}
function setTop(d){const t=document.getElementById('top');
 document.documentElement.style.setProperty('--legc',d?d.colour:'#14161A');
 t.style.background=d?d.colour:'#14161A';
 document.getElementById('tLeg').textContent=d?d.leg:'Japan 2026';
 document.getElementById('tTitle').textContent=d?d.title:'24 Aug \u2013 19 Sep';
 document.getElementById('tSub').textContent=d?d.date+' \u00b7 Day '+(D.days.indexOf(d)+1)+' of 27':'26 nights \u00b7 seven stays';}
function strip(){const s=document.getElementById('strip');
 if(tab!=='today'&&tab!=='days'){s.style.display='none';return}
 s.style.display='flex';const ti=todayIdx();
 s.innerHTML=D.days.map((d,i)=>{const[w,n]=d.date.split(' ');
  return `<div class="chip${i===cur?' on':''}${i===ti?' today':''}" style="--c:${d.colour}" data-i="${i}">${w}<b>${n}</b></div>`}).join('');
 const on=s.querySelector('.chip.on'); if(on)on.scrollIntoView({inline:'center',block:'nearest'});}
function evCard(b,live){const[kc]=K[b.k]||K.visit;
 const vb=b.v?`<span class="vibe" style="background:${V[b.v][0]}">${V[b.v][1]}</span>`:'';
 const dl=dirs(b.t); const ml=dl?`<a class="mapl" href="${dl}">Transit directions \u2192</a>`:(b.m?`<a class="mapl" href="${gmap(b.t)}">Open in Maps \u2192</a>`:'');
 const tr=b.tr?`<div class="tr"><span>\u21B3</span><span>${esc(b.tr)}</span></div>`:'';
 const de=b.d?`<p>${esc(b.d)}</p>`:'';
 const rw=(vb||ml)?`<div class="row">${vb}${ml}</div>`:'';
 return `${live?'<div class="now"><span class="dot"></span><span>Happening now</span></div>':''}
 <div class="ev" style="--nc:${kc}"><div class="tm">${b.s}<i>${b.e}</i></div><div class="node"></div>
 <div class="card">${de||tr||rw?`<h3>${esc(b.t)}</h3>${de}${tr}${rw}`:`<h3>${esc(b.t)}</h3>`}</div></div>`;}
function renderDay(i){const d=D.days[i]; if(!d)return'';
 const ti=todayIdx(), now=new Date(), nm=now.getHours()*60+now.getMinutes();
 let done=false;
 const evs=d.blocks.map(b=>{let live=false;
   if(i===ti&&!done&&mins(b.e)>nm){live=true;done=true}
   return evCard(b,live)}).join('');
 return `<div class="hotel"><span>\u{1F3E8}</span><span>${esc(d.hotel)}</span><a href="${gmap(d.hotel)}">Maps</a></div>
  <div class="rail">${evs}</div>`;}
function render(){const v=document.getElementById('view');
 if(tab==='today'||tab==='days'){setTop(D.days[cur]); strip(); v.innerHTML=renderDay(cur); return}
 setTop(null); strip();
 if(tab==='food'){
  const g={};D.tracker.forEach(t=>{(g[t.date]=g[t.date]||[]).push(t)});
  const c=D.tracker.reduce((a,t)=>(a[t.status]=(a[t.status]||0)+1,a),{});
  v.innerHTML=`<div class="sec">${c.booked||0} booked \u00b7 ${c.pending||0} awaiting \u00b7 ${c.todo||0} to book \u00b7 ${c.walkin||0} walk-in</div>`
   + Object.keys(g).map(dt=>`<div class="sec">${dt}</div>`+g[dt].map(t=>
     `<div class="li"><div class="when">${t.meal==='L'?'Lunch':'Dinner'}</div>
      <div class="nm">${esc(clean(t.name))}${tim(t.name)?`<em>${tim(t.name)}</em>`:''}</div><span class="pill st-${t.status}">${LBL[t.status]}</span></div>`).join('')).join('');
  return}
 if(tab==='terms'){v.innerHTML=`<div class="sec">Getting around</div>`+
   TRAVEL.map(([n,t,u])=>`<div class="gl"><b>${esc(n)}</b><p>${esc(t)}</p>${u?`<a class="mapl" href="${u}">Open \u2192</a>`:''}</div>`).join('')+
   `<div class="sec">What the words mean</div>`+
   GL.map(([n,t])=>`<div class="gl"><b>${esc(n)}</b><p>${esc(t)}</p></div>`).join(''); return}
 if(tab==='find'){v.innerHTML=`<input id="q" placeholder="Search places, food, days\u2026" autocomplete="off">
   <div id="res"><div class="empty">Type to search everything \u2014 every activity, restaurant, bar and note across all 27 days.</div></div>`;
  const q=document.getElementById('q'); q.focus();
  q.oninput=()=>{const s=q.value.trim().toLowerCase();
   if(s.length<2){document.getElementById('res').innerHTML='<div class="empty">Keep typing\u2026</div>';return}
   const out=[];D.days.forEach((d,i)=>d.blocks.forEach(b=>{
    if((b.t+' '+b.d+' '+b.tr).toLowerCase().includes(s))out.push({i,d,b})}));
   document.getElementById('res').innerHTML = out.length? out.slice(0,60).map(r=>
    `<div class="li" data-go="${r.i}"><div class="when">${r.b.s}</div>
     <div class="nm">${esc(r.b.t)}<em>${esc(r.d.date)} \u00b7 ${esc(r.d.leg)}</em></div></div>`).join('')
    : `<div class="empty">Nothing matches \u201c${esc(q.value)}\u201d.<br>Try a place, a dish, or a station name.</div>`;};
  return}}
document.getElementById('strip').onclick=e=>{const c=e.target.closest('.chip'); if(!c)return;
 cur=+c.dataset.i; render(); window.scrollTo({top:0})};
document.getElementById('view').onclick=e=>{const r=e.target.closest('[data-go]'); if(!r)return;
 cur=+r.dataset.go; tab='days'; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='days'));
 render(); window.scrollTo({top:0})};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b)return;
 tab=b.dataset.t; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
 if(tab==='today'){const t=todayIdx(); cur=t>=0?t:0}
 render(); window.scrollTo({top:0})};
const t0=todayIdx(); cur=t0>=0?t0:0; render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{
 navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script>
