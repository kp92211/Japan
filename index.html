"la":35.6672,"lo":139.6905,"a":"","rec":"H"},{"n":"Joto (Shibuya)","d":"Hannah’s — very good katsu curry, served almost instantly. Long queue but worth it; not a leisurely dinner.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6595,"lo":139.7005,"a":"Shibuya","rec":"H"},{"n":"i.m.donut?","d":"Your own shortlist — the cult fluffy donuts; branches in Omotesando and Nakameguro.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6652,"lo":139.7126,"a":"Omotesando","rec":"K"},{"n":"Iyoshi Cola","d":"Sajni’s — craft cola brewed from spices by a former pharmacist. She tried hard to get there and missed it.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6672,"lo":139.6905,"a":"","rec":"S"},{"n":"reload (Shimokitazawa)","d":"Your own shortlist — a low-rise complex of independent shops, coffee and small studios. Pairs with the Shimokitazawa branch of Shirubee.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6613,"lo":139.668,"a":"Shimokitazawa","rec":"K"},{"n":"Yakitorisakagura","d":"Shosuke HontenFriend rec — a 'random izakaya full of locals', skewers and small plates, Shibuya. Displaced from Tue 25 Aug when Gohan Ya Isshin was confirmed for that night. Never booked; worth slotting into another Shibuya evening.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6595,"lo":139.7005,"a":"Shibuya"},{"n":"Torioka,","d":"Azabudai Hills Torishiki offshoot yakitori — dropped from Sunday since it's the same cuisine as the already-booked Yakitori Shinohara, and genuinely hard to book on top of that. Worth it another trip, or if you want a second yakitori night after all.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6605,"lo":139.7415,"a":"Azabudai"},{"n":"Nezu","d":"Museum & garden Serene private collection with a bamboo-walled approach, 15 min from Omotesando.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.7205,"lo":139.766,"a":"Nezu"},{"n":"Shirubee (Shimokitazawa or","d":"Shibuya) Concierge izakaya pick — bumped from Thursday for Yakitori Shinohara. Raucous open kitchen, flame-seared mackerel, sake-led; open daily to midnight. Two branches: Shimokitazawa or the smaller Jinnan (Shibuya) one.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6613,"lo":139.668,"a":"Shimokitazawa","rec":"T"},{"n":"Tsukishima","d":"Monja Kuuya + TIGHTRecommended by BOTH Hannah and Sajni — monjayaki done properly on Tsukishima's monja street; tiny bars on the same street incl. TIGHT (homemade infusions — yuzu gin, orange brandy).","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6647,"lo":139.784,"a":"Tsukishima"},{"n":"Shimokitazawa","d":"Vintage shops, record stores, tiny live venues — Tokyo's loose-fit neighbourhood. Easy Inokashira Line hop from Shibuya.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6613,"lo":139.668,"a":"Shimokitazawa"},{"n":"Miyashita","d":"Park rooftop Park-on-a-mall above Shibuya — sunset beers with the crossing below.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.662,"lo":139.701,"a":"Miyashita"},{"n":"Hoppy","d":"Street, Asakusa Day-drinking lane of open-front izakaya — pairs with the Friday morning if you linger east.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.7148,"lo":139.7967,"a":"Asakusa"},{"n":"Shinjuku","d":"Pit Inn Storied basement jazz club (friend rec) — check the night's programme; pairs with the Saturday Shinjuku evening.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6896,"lo":139.7006,"a":"Shinjuku"},{"n":"Shibuya","d":"Scramble views Mag's Park rooftop (Shibuya 109-2) or the Starbucks window for the crossing shot — free-ish alternatives to Shibuya Sky.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6595,"lo":139.7005,"a":"Shibuya"},{"n":"Sharikimon","d":"Onozawa Concierge izakaya pick — bumped from Friday since it's closed in July (recheck for September). Worth checking again for a future trip.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6672,"lo":139.6905,"a":""},{"n":"Gyuukatsu","d":"Motomura (Shibuya)Bumped from Saturday — rare-fried beef cutlet on a hot stone; works as a lunch any Shibuya day. Queue at opening.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6595,"lo":139.7005,"a":"Shibuya"},{"n":"Uogashi","d":"Nihon-Ichi (Dōgenzaka)Standing sushi bar — excellent 15-minute bite, any day you're passing.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.658,"lo":139.6975,"a":"Dōgenzaka","rec":"H"},{"n":"HIBI","d":"HARE BARE (Shinjuku)Friend rec: superb modern sushi + sake/wine list — book ahead; alternative Shinjuku dinner for the Saturday.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6896,"lo":139.7006,"a":"Shinjuku"},{"n":"Shibuya cocktail duo","d":"The Bellwood · The SG Club — two of Shibuya's best bars, all bookable-or-walk-in near the hotel.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6595,"lo":139.7005,"a":"Shibuya"},{"n":"Not","d":"Suspicious (bar) Correction: this is NOT in Shibuya — it's up near Ueno/Iriya. A genuinely good bar, just pair it with an Ueno day rather than a Shibuya night.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.7141,"lo":139.7774,"a":"Ueno"},{"n":"Micasadeco &","d":"Café (Jingumae)Fluffy soufflé pancakes, alternative to Flippers — mornings are calmest.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.6702,"lo":139.708,"a":"Jingumae","rec":"S"},{"n":"Ueno","d":"Park Museums, lotus ponds, street life — adjoins the Saturday Yanaka morning if you want to extend east.","leg":"Tokyo — Arrival","c":"#A61C1C","la":35.7141,"lo":139.7774,"a":"Ueno"},{"n":"Kobe Beef WANOMIYA (Kuromon)","d":"Hannah’s — Kobe beef, “must have.” She notes it needn’t be here specifically; there are plenty of places. Was the Sat lunch before Sakai took that day.","leg":"Osaka","c":"#144A8C","la":34.665,"lo":135.5063,"a":"Kuromon","rec":"H"},{"n":"Naruto Taiyaki Hompo","d":"Hannah’s — taiyaki, the fish-shaped cake filled with sweet bean paste or custard. Her dessert pick for Osaka.","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":"","rec":"H"},{"n":"Himeji Castle","d":"Dropped from Sat 29 Aug for the Sakai workshop — Japan’s finest surviving original castle, ~1 hr by JR Special Rapid. A full nine-hour day for one building, and Saturdays are its busiest. Entry rose to ¥2,500 in March 2026. Still the best castle in the country if you change your mind.","leg":"Osaka","c":"#144A8C","la":34.5593,"lo":135.488,"a":"Sakai"},{"n":"Osaka","d":"Castle & park Moved off the arrival day — the 15:45 arrival left barely 45 min before the tower's 16:30 last entry, and with Himeji now on the Saturday you already have a far better castle. The moated park and grounds are free and open 24/7, so a walk-around still works any morning; the tower itself is a 1931 concrete reconstruction.","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":""},{"n":"Konoha","d":"Michelin 1-star tempura kaiseki — the original Tue 1 Sep Jul pick, bumped for Ajikitchō Bunbu-an since single-guest availability couldn't be confirmed in advance (2 seats held, priority to parties of 2; a day-of call might work).","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":"","rec":"R"},{"n":"Tsuruhashi","d":"Korea Town Japan's largest Koreatown — ~800 shops, 6 markets, yakiniku. Downgraded to optional since you're heading to South Korea after; still a distinct post- war Osaka neighbourhood if you want it.","leg":"Osaka","c":"#144A8C","la":34.665,"lo":135.535,"a":"Tsuruhashi"},{"n":"Kuromon","d":"Ichiba Market Fresh seafood and local treats, best before 11am.","leg":"Osaka","c":"#144A8C","la":34.665,"lo":135.5063,"a":"Kuromon","rec":"H"},{"n":"Shinsekai &","d":"Tsutenkaku TowerRetro district, iconic tower with city views — pairs with a kushikatsu night.","leg":"Osaka","c":"#144A8C","la":34.6524,"lo":135.5062,"a":"Shinsekai","rec":"H"},{"n":"Den-Den","d":"Town Osaka's electronics/anime district, a smaller Akihabara.","leg":"Osaka","c":"#144A8C","la":34.662,"lo":135.506,"a":"Den-Den"},{"n":"Tempozan","d":"Ferris Wheel Great view over Osaka Bay, next to the aquarium.","leg":"Osaka","c":"#144A8C","la":34.6545,"lo":135.429,"a":"Tempozan"},{"n":"Abeno","d":"Harukas Japan's tallest skyscraper, observation deck.","leg":"Osaka","c":"#144A8C","la":34.6458,"lo":135.5136,"a":"Abeno"},{"n":"Tennoji","d":"Park & Zoo Free green oasis right by Shinsekai, with Japan's 3rd-oldest zoo (est. 1915) inside. Honest take: cheap (¥500) and central, but reviews are genuinely split on animal welfare — some enclosures are small and dated. Worth a walk-through if you're already at Shinsekai; skip the zoo itself if that concerns you.","leg":"Osaka","c":"#144A8C","la":34.6465,"lo":135.5133,"a":"Tennoji"},{"n":"Nintoku-tenno-ryo","d":"Kofun (Sakai)UNESCO World Heritage — Japan's largest keyhole tomb. Honest take: genuinely underwhelming at ground level — you can't enter it, can't see the keyhole shape (it's a forested mound), and most visitors say 'there's not much to do.' The real payoff is the aerial view from Sakai City Hall's free 21st- floor observatory, or satellite photos. Needs its own half-day trip to Sakai (~20-30 min out) — not an easy add to this schedule; consider only if genuinely into archaeology.","leg":"Osaka","c":"#144A8C","la":34.5593,"lo":135.488,"a":"Sakai"},{"n":"Imai","d":"Honten Classic kitsune udon in Dotonbori — a lighter lunch option.","leg":"Osaka","c":"#144A8C","la":34.6687,"lo":135.5013,"a":"Dotonbori"},{"n":"Takoyaki","d":"Wanaka Dashi-forward takoyaki near the Glico sign, no sauce needed.","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":""},{"n":"551","d":"Horai butaman Osaka's famous pork buns — a snack stop anywhere in Minami.","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":""},{"n":"Gorichan onigiri —","d":"Friend rec: very good onigiri.","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":"","rec":"H"},{"n":"Manpuku Bakery (Kitahama)","d":"Now scheduled for Sat 29 Aug — friend rec for the curry bun. Tiny shop, queues, open late.","leg":"Osaka","c":"#144A8C","la":34.7025,"lo":135.4959,"a":"Kita","rec":"H"},{"n":"Unadon 昼だけうなぎ屋 天満橋店 —","d":"Friend rec: eel rice, Temmabashi.","leg":"Osaka","c":"#144A8C","la":34.688,"lo":135.515,"a":"Temmabashi","rec":"H"},{"n":"Neel","d":"Café Friend rec: the pork sando was 'gooooood'. Good coffee-and-sando stop while thrift shopping in Nakazaki.","leg":"Osaka","c":"#144A8C","la":34.708,"lo":135.506,"a":"Nakazaki","rec":"H"},{"n":"Glitch","d":"Coffee Osaka Specialty coffee, sister to the acclaimed Tokyo original.","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":""},{"n":"Tempura","d":"Makino Friend rec, tempura.","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":""},{"n":"Kare pan (curry bread)","d":"A dish rather than a shop — the friend list flagged it without naming a place. Manpuku Bakery in Kitahama is the one now scheduled for it.","leg":"Osaka","c":"#144A8C","la":34.7025,"lo":135.4959,"a":"Kita"},{"n":"Big","d":"Echo karaoke Friend rec — karaoke, if the night calls for it.","leg":"Osaka","c":"#144A8C","la":34.682,"lo":135.499,"a":""},{"n":"なおしまヒラメ (Naoshima Hirame)","d":"Hannah’s — small place right by the port doing very fresh flounder. The easy alternative to Toshi.","leg":"Naoshima & Teshima","c":"#0F6B63","la":34.46,"lo":133.995,"a":"Naoshima","rec":"H"},{"n":"Naoshima Sousakuryori Toshi","d":"Hannah’s — set dinner of sea bream sashimi, assorted fish and tempura. She booked ahead via Instagram. The strongest answer to the open “Island dinner” slot on Wed 2 Sep.","leg":"Naoshima & Teshima","c":"#0F6B63","la":34.46,"lo":133.995,"a":"Naoshima","rec":"H"},{"n":"ANDO","d":"Museum (Honmura) A restored traditional house showing Ando's architectural process.","leg":"Naoshima & Teshima","c":"#0F6B63","la":34.456,"lo":133.999,"a":"Honmura"},{"n":"Naoshima","d":"Bath 'I♥湯' A working public bathhouse turned art installation — genuinely bathe in it.","leg":"Naoshima & Teshima","c":"#0F6B63","la":34.46,"lo":133.995,"a":"Naoshima"},{"n":"Other","d":"Art House Project sitesKadoya, Go'o Shrine, Haisha — beyond Minamidera, scattered through Honmura village.","leg":"Naoshima & Teshima","c":"#0F6B63","la":34.456,"lo":133.999,"a":"Honmura"},{"n":"Teshima","d":"8 Million Lab A small sound/light installation on Teshima, easy to combine with the e-bike loop.","leg":"Naoshima & Teshima","c":"#0F6B63","la":34.475,"lo":134.098,"a":"Teshima","rec":"H"},{"n":"Ginza Music Bar Kyoto","d":"Hannah’s — “really great listening bar” in Gion. Already scheduled as the Wed 9 Sep nightcap; here as a reminder it’s hers.","leg":"Kyoto","c":"#1B6B4A","la":35.0037,"lo":135.7788,"a":"Gion","rec":"H"},{"n":"Tarekatsu","d":"Your own shortlist — Kyoto tonkatsu. Note you already have Ponchi-ken in Tokyo, so this would be a second cutlet.","leg":"Kyoto","c":"#1B6B4A","la":34.9858,"lo":135.7588,"a":"","rec":"K"},{"n":"Restaurant Muni","d":"Your own shortlist — the one you asked Yasuko about in July and never got an answer on. French-leaning, riverside at Muni Kyoto in Arashiyama. Worth chasing if you want a break from kaiseki.","leg":"Kyoto","c":"#1B6B4A","la":35.0094,"lo":135.667,"a":"Arashiyama","rec":"K"},{"n":"Heian-jingū","d":"Shrine Giant vermilion torii and a strolling garden, near Nanzen-ji. Dropped from Wed 9 Sep to get across to Kokage before it closes at 14:00 — easy to add back on any Higashiyama morning if you skip the Daitoku-ji detour.","leg":"Kyoto","c":"#1B6B4A","la":35.043,"lo":135.746,"a":"Daitoku"},{"n":"teamLab","d":"Biovortex Big new digital-art museum (opened Oct 2025), ~8–10 min from Kyoto Station Hachijo exit (by the hotel). Timed ticket, ~3 hrs. Good spare-evening or rainy option.","leg":"Kyoto","c":"#1B6B4A","la":34.9858,"lo":135.7588,"a":"Kyoto Station"},{"n":"Mount","d":"Kurama Temple-mountain hike ~30 min north (Kurama-dera → Kibune, onsen option). Half-day; Arashiyama takes priority.","leg":"Kyoto","c":"#1B6B4A","la":35.0094,"lo":135.667,"a":"Arashiyama"},{"n":"Amam","d":"Dacotan Cult bakery — extravagant pastries and breads. Slot in on any morning.","leg":"Kyoto","c":"#1B6B4A","la":34.9858,"lo":135.7588,"a":""},{"n":"Subasoba","d":"Lunch spot — distinctive soba; good midday option between sights.","leg":"Kyoto","c":"#1B6B4A","la":34.9858,"lo":135.7588,"a":""},{"n":"Nanaya (Kyoto","d":"Sanjo shop) Ice cream — famous for graded matcha gelato (levels of intensity). Sanjo-area treat stop.","leg":"Kyoto","c":"#1B6B4A","la":35.009,"lo":135.77,"a":"Sanjo"},{"n":"Chao","d":"Chao Gyoza (Sanjo Kiyamachi) Cheap-and-cheerful gyoza izakaya by Pontocho — award-winning crispy dumplings (pork, shrimp, even chocolate for dessert). Lively, cash-friendly, expect a queue; open late.","leg":"Kyoto","c":"#1B6B4A","la":35.005,"lo":135.7706,"a":"Pontocho"},{"n":"Hi-Lite","d":"Shokudo Beloved 1960s Kyoto diner — famous jumbo chicken katsu (daikon-ponzu / tomato / cheese), huge portions, budget prices. Casual counter to the kaiseki. Several branches (Hyakumanben near Ginkaku-ji, Jujo, Oike).","leg":"Kyoto","c":"#1B6B4A","la":35.027,"lo":135.7982,"a":"Ginkaku"},{"n":"Kyo ha","d":"Matcha de Kimeru Friend rec — very good matcha.","leg":"Kyoto","c":"#1B6B4A","la":34.9858,"lo":135.7588,"a":""},{"n":"Omen (udon)","d":"Friend rec — great udon near Ginkaku-ji. (Juugo now scheduled as Wed 9 Sep lunch.)","leg":"Kyoto","c":"#1B6B4A","la":35.027,"lo":135.7982,"a":"Ginkaku","rec":"H"},{"n":"Weekenders","d":"Coffee Friend rec — great takeaway coffee (tucked behind a car park, Tominokoji).","leg":"Kyoto","c":"#1B6B4A","la":35.006,"lo":135.764,"a":"Tominokoji","rec":"H"},{"n":"BAR","d":"LIQUOR MUSEUM Friend rec — small bar, big back-bar.","leg":"Kyoto","c":"#1B6B4A","la":34.9858,"lo":135.7588,"a":""},{"n":"OIL (kissa bar)","d":"Friend rec — cool kissa bar, no menu but does all the basics (G&T, beer, sake, cocktails). Gets busier as the night goes on — go late.","leg":"Kyoto","c":"#1B6B4A","la":34.9858,"lo":135.7588,"a":"","rec":"H"},{"n":"Ramen","d":"Sen-no-Kaze Friend rec — two sisters run it; the miso ramen and chashu pork are excellent. Put your name down — the wait is LONG.","leg":"Kyoto","c":"#1B6B4A","la":34.9858,"lo":135.7588,"a":""},{"n":"Menami (obanzai)","d":"Home-style Kyoto obanzai on Kiyamachi — a    <div class="r"><input id="axh" value="${hh}" placeholder="19:30"><button id="axs">Add to this day</button></div></div>`;
  ab.style.display='none'; document.getElementById('axt').focus();
  document.getElementById('axs').onclick=()=>{
   const t=document.getElementById('axt').value.trim(); if(!t)return;
   let h=document.getElementById('axh').value.trim(); if(!/^\d{1,2}:\d{2}$/.test(h))h='12:00';
   if(h.length===4)h='0'+h;
   const iso=D.days[cur].iso; (ADD[iso]=ADD[iso]||[]).push({s:h,t:t}); saveA();
   setL(bid(iso,{s:h,t:t}),{s:'done'}); render();};
  return}
 const dl=e.target.closest('[data-del]');
 if(dl){const iso=dl.dataset.iso, t=dl.dataset.del;
  ADD[iso]=(ADD[iso]||[]).filter(x=>x.t!==t); if(!ADD[iso].length)delete ADD[iso]; saveA();
  Object.keys(LOG).forEach(k=>{if(k.startsWith(iso+'#')&&k.endsWith('#'+t.slice(0,40)))delete LOG[k]}); save();
  render(); return}
 const lb=e.target.closest('.lb');
 if(lb){const id=lb.closest('.log').dataset.id, act=lb.dataset.act;
  const cur=getL(id).s; setL(id,{s:cur===act?null:act}); render(); return}
 const st=e.target.closest('[data-star]');
 if(st){const id=st.closest('.log').dataset.id, v=+st.dataset.star;
  setL(id,{r:getL(id).r===v?0:v}); render(); return}
});
document.getElementById('view').addEventListener('change',e=>{
 const n=e.target.closest('.note'); if(!n)return; setL(n.dataset.id,{n:n.value});
});
document.getElementById('view').onclick2=null;
document.getElementById('view').onclick=e=>{const r=e.target.closest('[data-go]'); if(!r)return;
 cur=+r.dataset.go; tab='days'; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='days'));
 render(); window.scrollTo({top:0})};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b)return;
 tab=b.dataset.t; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
 if(tab==='today'){const t=todayIdx(); cur=t>=0?t:0}
 render(); window.scrollTo({top:0})};
const t0=todayIdx(); cur=t0>=0?t0:0; render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{
 navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
